<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>거점 방어전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b10; --panel:#121822; --panel2:#161f2b; --panel-line:#22303f;
    --gold:#e8a33d; --ally:#4fa3e3; --enemy:#e0483f; --hp:#3fbf7f;
    --text:#e7ecf1; --muted:#7d8ba0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Rajdhani',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #wrap{position:relative;width:100%;height:100vh;min-height:600px;display:flex;flex-direction:column;}

  /* ---------- battle HUD ---------- */
  #hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;
    background:linear-gradient(180deg,#0d1219,#0a0e13);border-bottom:1px solid var(--panel-line);
    z-index:5;flex-wrap:wrap;gap:8px;}
  .hud-title{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:2px;color:var(--gold);
    font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .hud-title:before{content:'';width:8px;height:8px;background:var(--gold);display:inline-block;
    box-shadow:0 0 8px var(--gold);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .stat-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;}
  .stat .label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
  .stat .value{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;}
  .value.gold{color:var(--gold);} .value.time{color:var(--hp);} .value.time.low{color:var(--enemy);}

  #gameScreen{display:none;flex-direction:column;flex:1;min-height:0;}
  #gameScreen.active{display:flex;}
  #roundBar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,0.08);z-index:6;}
  #roundBarFill{height:100%;width:100%;background:linear-gradient(90deg,#3fbf7f,#e8a33d);transition:width .2s linear, background .3s;}
  #stage{position:relative;flex:1;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);
    letter-spacing:.5px;background:rgba(10,14,19,.6);padding:5px 12px;border:1px solid var(--panel-line);
    border-radius:2px;pointer-events:none;z-index:4;text-align:center;max-width:90%;}

  #cmdBtn{position:absolute;right:14px;top:14px;z-index:7;font-family:'Orbitron',sans-serif;font-size:11px;
    letter-spacing:1px;background:linear-gradient(180deg,#1c2732,#131b24);border:1px solid var(--ally);
    color:var(--ally);padding:8px 12px;border-radius:4px;cursor:pointer;display:none;
    animation:cmdPulse 1.4s ease-in-out infinite;}
  #cmdBtn.show{display:block;}
  @keyframes cmdPulse{0%,100%{box-shadow:0 0 0 rgba(79,163,227,0);}50%{box-shadow:0 0 10px rgba(79,163,227,.7);}}
  #cmdPanel{position:absolute;right:14px;top:56px;z-index:7;background:var(--panel);border:1px solid var(--ally);
    border-radius:6px;padding:10px;width:220px;display:none;}
  #cmdPanel.show{display:block;}
  #cmdPanel .cmd-title{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
  #cmdPanel .cmd-bar{height:3px;background:#1b2530;border-radius:2px;overflow:hidden;margin-bottom:8px;}
  #cmdPanel .cmd-bar-fill{height:100%;background:var(--ally);width:100%;}
  #cmdPanel button{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--panel-line);
    color:var(--text);padding:8px;margin-bottom:6px;border-radius:4px;cursor:pointer;font-family:'Rajdhani',sans-serif;
    font-size:12.5px;font-weight:600;}
  #cmdPanel button:hover{border-color:var(--ally);}
  #cmdPanel button b{display:block;font-size:13px;color:var(--ally);margin-bottom:2px;}

  #overlay{position:absolute;inset:0;background:rgba(6,9,13,.9);display:none;align-items:center;justify-content:center;
    flex-direction:column;z-index:10;text-align:center;gap:12px;}
  #overlay.show{display:flex;}
  #overlay h1{font-family:'Orbitron',sans-serif;letter-spacing:3px;font-size:28px;margin:0;}
  #overlay .stats{color:var(--muted);font-size:14px;letter-spacing:1px;}
  #overlay .stats b{color:var(--text);}
  #overlay .gold-earn{font-family:'Orbitron',sans-serif;color:var(--gold);font-size:20px;font-weight:700;
    text-shadow:0 0 14px rgba(232,163,61,.5);display:flex;align-items:center;gap:8px;}
  #overlay .gold-earn small{font-family:'Rajdhani',sans-serif;font-size:12px;color:var(--muted);font-weight:600;}
  #lobbyBtn{font-family:'Orbitron',sans-serif;background:var(--gold);color:#1a1305;border:none;padding:11px 26px;
    font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;border-radius:2px;margin-top:6px;}
  #lobbyBtn:hover{filter:brightness(1.1);}

  .warn-banner{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:8;
    font-family:'Orbitron',sans-serif;color:var(--enemy);font-size:22px;letter-spacing:2px;font-weight:900;
    text-shadow:0 0 16px rgba(224,72,63,.8);pointer-events:none;opacity:0;}
  .warn-banner.show{animation:warnFlash 2s ease-out forwards;}
  @keyframes warnFlash{0%{opacity:0;transform:translate(-50%,-60%) scale(.8);}15%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    80%{opacity:1;}100%{opacity:0;}}

  /* ---------- lobby: 가지형 스킬트리 ---------- */
  #lobbyScreen{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden;}
  #lobbyScreen.active{display:flex;}
  #opTopBar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--panel-line);
    background:linear-gradient(180deg,#0d1219,#0a0e13);z-index:5;}
  #opTopBar h1{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:2px;margin:0;white-space:nowrap;}
  #opTopStats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  #opTopStats .stat .value{font-size:14px;}
  #startRoundBtn{font-family:'Orbitron',sans-serif;background:linear-gradient(180deg,#ffcf7a,var(--gold));
    color:#1a1305;border:none;padding:10px 20px;font-size:13px;font-weight:900;letter-spacing:2px;cursor:pointer;
    border-radius:3px;box-shadow:0 0 16px rgba(232,163,61,.3);white-space:nowrap;}
  #startRoundBtn:hover{filter:brightness(1.08);}

  #treeViewport{flex:1;min-height:0;position:relative;overflow:hidden;background:#080b10;touch-action:none;cursor:grab;}
  #treeViewport.grabbing{cursor:grabbing;}
  #treeSvgWrap{position:absolute;top:0;left:0;transform-origin:0 0;}
  #treeSvg{display:block;}

  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;
    background:rgba(18,24,34,.92);border:1px solid var(--gold);color:var(--gold);padding:8px 16px;
    border-radius:4px;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:1px;
    opacity:0;pointer-events:none;white-space:nowrap;}
  #toast.show{animation:toastPop 1.8s ease-out forwards;}
  @keyframes toastPop{0%{opacity:0;transform:translateX(-50%) translateY(-6px);}12%{opacity:1;transform:translateX(-50%) translateY(0);}
    80%{opacity:1;}100%{opacity:0;}}

  #zoomControls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:6;}
  #zoomControls button{width:34px;height:34px;border-radius:4px;border:1px solid var(--panel-line);
    background:rgba(18,24,34,.85);color:var(--text);font-size:16px;cursor:pointer;font-family:'Orbitron',sans-serif;}
  #zoomControls button:hover{border-color:var(--gold);color:var(--gold);}

  .tr-edge{stroke:#e8a33d;stroke-width:2;fill:none;pointer-events:none;opacity:.35;}
  .tr-edge.owned{opacity:.95;}
  .tr-edge.reveal-anim{animation:edgeReveal .5s ease-out;}
  @keyframes edgeReveal{0%{opacity:0;}50%{opacity:1;filter:drop-shadow(0 0 4px #e8a33d);}100%{opacity:.95;}}

  .sk-node{cursor:pointer;}
  .sk-node .box{stroke-width:2;transition:filter .15s;}
  .sk-node .icon-t{font-size:17px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .sk-node .lvl-t{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;}
  .sk-node.state-locked .lvl-t{fill:var(--muted);}
  .sk-node .name-t{font-family:'Rajdhani',sans-serif;font-size:10.5px;font-weight:700;fill:var(--text);text-anchor:middle;pointer-events:none;}
  .sk-node .max-ring{fill:none;stroke:#fff;stroke-width:1.4;opacity:.85;}
  .sk-node.reveal-anim{animation:childReveal .35s ease-out;}
  @keyframes childReveal{0%{opacity:0;transform:scale(.6);}100%{opacity:1;transform:scale(1);}}
  .sk-node.unlock-pop .box{animation:unlockPop .4s ease-out;}
  @keyframes unlockPop{0%{filter:drop-shadow(0 0 0 #fff);}40%{filter:drop-shadow(0 0 10px #fff);}100%{filter:drop-shadow(0 0 0 #fff);}}
  .sk-node.level-flash .box{animation:levelFlash .35s ease-out;}
  @keyframes levelFlash{0%{filter:drop-shadow(0 0 0 #e8a33d);}50%{filter:drop-shadow(0 0 8px #e8a33d);}100%{filter:drop-shadow(0 0 0 #e8a33d);}}

  /* ---------- detail panel ---------- */
  #skillPanel{position:fixed;right:14px;bottom:14px;width:280px;max-height:60vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:14px;
    display:none;flex-direction:column;gap:10px;z-index:9;box-shadow:0 8px 26px rgba(0,0,0,.5);
    pointer-events:none;}
  #skillPanel.open{display:flex;}
  #skillPanel .p-close{display:none;}
  #skillPanel .p-head{display:flex;align-items:center;gap:10px;}
  #skillPanel .p-name{font-weight:700;font-size:15px;}
  #skillPanel .p-desc{font-size:11.5px;color:var(--muted);line-height:1.4;}
  #skillPanel .p-lvl{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold);margin-top:2px;}
  #skillPanel .p-effect{background:var(--panel2);border-radius:4px;padding:9px 10px;font-size:13px;line-height:1.4;}
  #skillPanel .p-effect .change{color:var(--text);font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.2px;}
  #skillPanel .p-effect .change .from{color:var(--hp);}
  #skillPanel .p-effect .change .arrow{color:var(--muted);padding:0 7px;}
  #skillPanel .p-effect .change .to{color:var(--ally);}
  #skillPanel .p-reason{font-size:12px;color:var(--gold);background:rgba(232,163,61,.08);
    border:1px solid rgba(232,163,61,.42);padding:8px;border-radius:4px;line-height:1.5;}
  #skillPanel .p-buy{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;background:linear-gradient(180deg,#2a1f14,#1a1305);
    border:1px solid var(--gold);color:var(--gold);padding:10px;cursor:pointer;border-radius:4px;}
  #skillPanel .p-buy:disabled{opacity:.35;cursor:not-allowed;border-color:var(--muted);color:var(--muted);}
  #skillPanel .p-max{font-family:'Orbitron',sans-serif;color:#fff;background:#2a3a2c;border:1px solid var(--hp);
    padding:10px;text-align:center;border-radius:4px;font-size:13px;}


  /* ---------- progressive combat spectacle ---------- */
  #fxTierBadge{
    position:absolute;left:14px;top:14px;z-index:7;display:flex;align-items:center;gap:8px;
    padding:7px 10px;border:1px solid rgba(79,163,227,.35);background:rgba(8,12,18,.72);
    backdrop-filter:blur(6px);border-radius:4px;pointer-events:none;
    font-family:'Orbitron',sans-serif;letter-spacing:1px;text-transform:uppercase;
  }
  #fxTierBadge span{font-size:9px;color:var(--muted);}
  #fxTierBadge b{font-size:12px;color:var(--ally);text-shadow:0 0 10px rgba(79,163,227,.75);}
  #fxTierBadge.tier-3,#fxTierBadge.tier-4,#fxTierBadge.tier-5{
    border-color:rgba(232,163,61,.6);box-shadow:0 0 15px rgba(232,163,61,.12) inset;
  }
  #fxTierBadge.tier-3 b,#fxTierBadge.tier-4 b,#fxTierBadge.tier-5 b{color:#ffd06e;text-shadow:0 0 12px rgba(255,208,110,.85);}
  #fxTierBadge.tier-5{animation:omegaBadge 1.1s ease-in-out infinite;}
  @keyframes omegaBadge{0%,100%{box-shadow:0 0 8px rgba(255,91,91,.16),0 0 14px rgba(232,163,61,.12) inset}
    50%{box-shadow:0 0 20px rgba(255,91,91,.32),0 0 24px rgba(232,163,61,.22) inset}}

  #comboHud{
    position:absolute;left:50%;top:16px;transform:translateX(-50%) scale(.85);z-index:7;
    min-width:132px;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .18s;
    font-family:'Orbitron',sans-serif;text-shadow:0 0 14px rgba(232,163,61,.85);
  }
  #comboHud.show{opacity:1;transform:translateX(-50%) scale(1);}
  #comboHud b{display:block;font-size:19px;color:#ffd06e;letter-spacing:2px;}
  #comboHud small{display:block;font-size:8px;color:#fff1bf;letter-spacing:4px;margin-top:-2px;}

  #bossHud{
    position:absolute;left:50%;top:52px;transform:translateX(-50%) translateY(-8px);z-index:7;
    width:min(470px,72vw);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  #bossHud.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #bossHud .boss-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:2px;color:#ffb2aa;text-shadow:0 0 10px rgba(224,72,63,.7);}
  #bossHud .boss-track{height:9px;border:1px solid rgba(255,150,140,.55);background:rgba(10,5,7,.8);
    border-radius:2px;padding:2px;box-shadow:0 0 16px rgba(224,72,63,.18);}
  #bossHudFill{height:100%;width:100%;background:linear-gradient(90deg,#8b1018,#ff5349,#ffb86b);
    box-shadow:0 0 12px rgba(255,83,73,.8);transition:width .08s linear;}

  #dangerVignette,#screenFlashDom{
    position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;
  }
  #dangerVignette{box-shadow:inset 0 0 90px 25px rgba(224,35,35,.75);mix-blend-mode:screen;}
  #screenFlashDom{background:#fff;mix-blend-mode:screen;}

  @media (max-width:700px){
    #fxTierBadge{top:10px;left:8px;padding:5px 7px}
    #fxTierBadge span{display:none}
    #comboHud{top:11px}
    #bossHud{top:47px;width:82vw}
  }

  @media (max-width:760px){
    #skillPanel{left:0;right:0;bottom:0;width:auto;max-height:50vh;border-radius:10px 10px 0 0;}
  }
</style>
</head>
<body>
<div id="wrap">

  <div id="gameScreen">
    <div id="hud">
      <div class="hud-title">거점 방어 사령부</div>
      <div class="stat-row">
        <div class="stat"><span class="label">골드</span><span class="value gold" id="goldVal">0</span></div>
        <div class="stat"><span class="label">남은 시간</span><span class="value time" id="timeVal">00:00</span></div>
        <div class="stat"><span class="label">웨이브</span><span class="value" id="waveVal">1</span></div>
        <div class="stat"><span class="label">병력</span><span class="value" id="troopVal">0</span></div>
      </div>
    </div>
    <div id="stage">
      <div id="roundBar"><div id="roundBarFill"></div></div>
      <canvas id="game"></canvas>
      <div id="fxTierBadge" class="tier-0"><span>전투 출력</span><b id="fxTierValue">I</b></div>
      <div id="comboHud"><b id="comboHudValue">COMBO x2</b><small>CHAIN KILL</small></div>
      <div id="bossHud">
        <div class="boss-line"><span>⚠ 지휘관급 위협체</span><span id="bossHpText">100%</span></div>
        <div class="boss-track"><div id="bossHudFill"></div></div>
      </div>
      <div id="dangerVignette"></div>
      <div id="screenFlashDom"></div>
      <div class="warn-banner" id="warnBanner"></div>
      <button id="cmdBtn">⚡ 지휘 명령 가능</button>
      <div id="cmdPanel">
        <div class="cmd-title">명령 하나를 선택하세요</div>
        <div class="cmd-bar"><div class="cmd-bar-fill" id="cmdBarFill"></div></div>
        <div id="cmdChoices"></div>
      </div>
      <div id="hint">기지를 누르면 혼합 기계부대 자동 편성 · 실드 벌크는 폭파병 차단 · 블래스트 캐논은 장갑·공성 적 우선 포격</div>
      <div id="overlay">
        <h1 id="overlayTitle">라운드 종료</h1>
        <div class="stats">생존 시간 <b id="finalTime">0</b>초 · 도달 웨이브 <b id="finalWave">1</b> · 처치 <b id="finalKills">0</b></div>
        <div class="gold-earn"><span>🪙</span><span id="goldEarnedEl">0</span> 골드 정산<small><span id="roundRewardNoteEl">수집 0</span> · 보유 <span id="goldBankedEl">0</span></small></div>
        <button id="lobbyBtn">로비로 이동</button>
      </div>
    </div>
  </div>

  <div id="lobbyScreen" class="active">
    <div id="opTopBar">
      <h1>⚔ 전장 지휘 스킬트리 <span id="testModeBadge" style="font-size:10px;color:#ffcf7a;border:1px solid #e8a33d;padding:3px 7px;border-radius:3px;margin-left:8px;">TEST · 골드 무제한</span></h1>
      <div id="opTopStats">
        <div class="stat"><span class="label">보유 골드</span><span class="value gold" id="topGoldVal">0</span></div>
        <div class="stat"><span class="label">전체 구매 레벨</span><span class="value" id="topLevelVal">0</span></div>
        <div class="stat"><span class="label">라운드 시간</span><span class="value" id="topRoundVal" style="color:var(--ally)">15초</span></div>
        <button id="startRoundBtn">전투 시작</button>
      </div>
    </div>
    <div id="treeViewport">
      <div id="treeSvgWrap"></div>
      <div id="toast"></div>
      <div id="zoomControls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">-</button>
        <button id="zoomReset">⟲</button>
      </div>
    </div>
  </div>

  <div id="skillPanel"><span class="p-close" id="panelClose">✕</span><div id="panelBody"></div></div>

</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;

  // 업로드된 아군 5종 이미지를 실제 전투 스프라이트로 사용한다.
  // 이미지가 늦게 로드되거나 누락되면 기존 도형형 폴백이 대신 그려져 전투가 멈추지 않는다.
  const UNIT_SPRITE_PATHS = {
    rifler:'assets/core-rifler.png',
    shield:'assets/shield-bulk.png',
    cannon:'assets/blast-cannon.png',
    collector:'assets/collector-robot.png',
    laserPod:'assets/base-laser-pod.png'
  };
  const unitSprites = {};
  for(const [key,src] of Object.entries(UNIT_SPRITE_PATHS)){
    const img=new Image();
    img.decoding='async';
    img.ready=false;
    img.addEventListener('load',()=>{img.ready=true;});
    img.addEventListener('error',()=>{img.ready=false;console.warn('유닛 이미지 로드 실패:',src);});
    img.src=src;
    unitSprites[key]=img;
  }
  function drawUnitSprite(key,width,height){
    const img=unitSprites[key];
    if(!img || !img.ready || !img.naturalWidth) return false;
    ctx.drawImage(img,-width/2,-height/2,width,height);
    return true;
  }

  const stage = document.getElementById('stage');
  const gameScreen = document.getElementById('gameScreen');
  const lobbyScreen = document.getElementById('lobbyScreen');
  const goldVal = document.getElementById('goldVal');
  const timeVal = document.getElementById('timeVal');
  const waveVal = document.getElementById('waveVal');
  const troopVal = document.getElementById('troopVal');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const lobbyBtn = document.getElementById('lobbyBtn');
  const finalTime = document.getElementById('finalTime');
  const finalWave = document.getElementById('finalWave');
  const finalKills = document.getElementById('finalKills');
  const goldEarnedEl = document.getElementById('goldEarnedEl');
  const goldBankedEl = document.getElementById('goldBankedEl');
  const roundRewardNoteEl = document.getElementById('roundRewardNoteEl');
  const roundBarFill = document.getElementById('roundBarFill');
  const warnBanner = document.getElementById('warnBanner');
  const cmdBtn = document.getElementById('cmdBtn');
  const cmdPanel = document.getElementById('cmdPanel');
  const cmdChoices = document.getElementById('cmdChoices');
  const fxTierBadge = document.getElementById('fxTierBadge');

  // ============================================================
  // 2) 저장 / 로드 (새 가지형 스킬트리 전용 저장소, saveVersion:7)
  // ============================================================
  // ============================================================
  // 테스트 모드 설정
  // true  = 골드 무제한 + 테스트 전용 저장 사용
  // false = 일반 골드 차감 + 기존 정식 저장 사용
  // 나중에 정식 버전으로 되돌릴 때 아래 한 줄만 false로 바꾸면 됩니다.
  // ============================================================
  const TEST_MODE_UNLIMITED_GOLD = true;
  // TEST_MODE_UNLIMITED_GOLD 선언 이후에 테스트 배지를 갱신해야
  // 초기 로딩 시 ReferenceError가 발생하지 않습니다.
  if(testModeBadge && !TEST_MODE_UNLIMITED_GOLD) testModeBadge.style.display='none';

  const NORMAL_SAVE_KEY = 'skillState_branch_v6';
  const SAVE_KEY = TEST_MODE_UNLIMITED_GOLD
    ? NORMAL_SAVE_KEY + '_unlimited_test'
    : NORMAL_SAVE_KEY;

  const skillState = { levels:{} };
  const meta = { gold:0, goldGainRemainder:0, records:{ rounds:0, bestWave:0, bestKills:0, bestTime:0 } };

  function hasEnoughGold(cost){
    return TEST_MODE_UNLIMITED_GOLD || meta.gold >= cost;
  }

  function spendGold(cost){
    if(!TEST_MODE_UNLIMITED_GOLD) meta.gold -= cost;
  }

  function bankGoldText(){
    return TEST_MODE_UNLIMITED_GOLD ? '∞ TEST' : String(Math.floor(meta.gold));
  }

  async function loadSave(){
    try{
      const res = await window.storage.get(SAVE_KEY, false);
      if(res && res.value){
        const data = JSON.parse(res.value);
        if(data.saveVersion>=6 && data.levels){
          // v6: 현재 가지형 스킬트리 저장
          SKILLS.forEach(s=> skillState.levels[s.id] = Math.max(0, Math.min(s.maxLevel, data.levels[s.id]||0)));
        } else if(data.baseLevels || data.moduleLevels){
          // v3: 기반업그레이드/전술모듈 분리 저장 -> 병합, 장착·교리·조건 데이터는 폐기
          SKILLS.forEach(s=>{
            let v=0;
            if(data.baseLevels && data.baseLevels[s.id]!==undefined) v=data.baseLevels[s.id];
            if(data.moduleLevels && data.moduleLevels[s.id]!==undefined) v=data.moduleLevels[s.id];
            skillState.levels[s.id] = Math.max(0, Math.min(s.maxLevel, v));
          });
        } else if(data.levels){
          // v1/v2 구형 평면 저장 (구 id 매핑)
          const OLD_ID_MAP = { hp:'baseDurability', dmg:'soldierDamage', vit:'soldierDurability', spd:'soldierMobility',
            gold:'goldGain', pickup:'pickupRadius', spawn:'summonSpeed', auto:'autoProduction',
            time:'operationDuration', roundDuration:'operationDuration' };
          const src = data.levels;
          SKILLS.forEach(s=>{
            let raw = src[s.id];
            if(raw===undefined){
              const oldKey = Object.keys(OLD_ID_MAP).find(k=>OLD_ID_MAP[k]===s.id && src[k]!==undefined);
              if(oldKey) raw = src[oldKey];
            }
            skillState.levels[s.id] = Math.max(0, Math.min(s.maxLevel, Math.round(raw||0)));
          });
        }
        // 제거된 시스템의 저장 필드(equippedModules/selectedDoctrine/selectedOperationModifier/
        // commandCapacity/unlockedOperationModifiers 등)는 존재해도 그냥 무시하고 읽지 않는다.
        meta.gold = typeof data.gold==='number' ? Math.max(0, Math.floor(data.gold)) : 0;
        // 골드 획득 스킬의 소수점 보너스는 라운드가 바뀌어도 사라지지 않게 저장한다.
        // 구버전 저장에는 값이 없으므로 0에서 시작한다.
        meta.goldGainRemainder = typeof data.goldGainRemainder==='number'
          ? Math.max(0, data.goldGainRemainder % 1)
          : 0;
        if(data.records){
          meta.records.rounds=data.records.rounds||0; meta.records.bestWave=data.records.bestWave||0;
          meta.records.bestKills=data.records.bestKills||0; meta.records.bestTime=data.records.bestTime||0;
        }
        persistSave();
      }
    }catch(e){ /* 저장 데이터 없음: 처음부터 시작 */ }
    renderLobby();
  }
  async function persistSave(){
    try{
      await window.storage.set(SAVE_KEY, JSON.stringify({
        saveVersion:9, gold:meta.gold, goldGainRemainder:meta.goldGainRemainder, levels:skillState.levels, records:meta.records
      }), false);

  }

  // ============================================================
  // 3) 조회 / 공개(reveal) / 구매 (장착·교리·조건·용량 없음)
  // ============================================================
  function L(id){ return skillState.levels[id]||0; }
  function totalLevel(){ return SKILLS.reduce((s,sk)=>s+L(sk.id),0); }
  function nextCost(s){ const l=L(s.id); return l<s.maxLevel ? s.costs[l] : null; }

  function isRevealed(id){
    const s = SKILL_MAP[id];
    if(!s.parent) return true; // 루트
    return L(s.parent) >= (s.unlockLevel||1);
  }
  function nodeState(s){
    const l = L(s.id);
    if(l>=s.maxLevel) return 'maxed';
    if(l===0) return 'available';
    return 'owned';
  }

  let buying = false; // 중복 구매 방지 잠금
  let justUnlockedId = null;
  let justLeveledId = null;
  let justRevealedIds = [];
  function buySkill(id){
    if(buying) return false;
    const s = SKILL_MAP[id]; const l = L(id);
    if(l>=s.maxLevel) return false;
    if(!isRevealed(id)) return false;
    const cost = nextCost(s);
    if(!hasEnoughGold(cost)) return false;

    buying = true;
    const revealedBefore = new Set(SKILLS.filter(sk=>isRevealed(sk.id)).map(sk=>sk.id));
    spendGold(cost);
    skillState.levels[id] = l+1;
    const revealedAfter = SKILLS.filter(sk=>isRevealed(sk.id)).map(sk=>sk.id);
    justUnlockedId = (l+1===1) ? id : null;
    justLeveledId = (l+1>1) ? id : null;
    justRevealedIds = revealedAfter.filter(x=>!revealedBefore.has(x));
    persistSave();
    buying = false;
    return true;
  }

  // ============================================================
  // 4) 전투 효과 계산 (구매한 레벨이 항상 그대로 적용됨, 중복 누적 없음)
  // ============================================================
  function getBaseMaxHp(){ return Math.round(100*(1+(L('baseDurability')>0?SKILL_MAP.baseDurability.values[L('baseDurability')-1]:0)/100)); }
  function getSoldierDamageMult(){ return 1+(L('soldierDamage')>0?SKILL_MAP.soldierDamage.values[L('soldierDamage')-1]:0)/100; }
  function getSoldierHpMult(){ return 1+(L('soldierDurability')>0?SKILL_MAP.soldierDurability.values[L('soldierDurability')-1]:0)/100; }
  function getSoldierSpeedMult(){ return 1+(L('soldierMobility')>0?SKILL_MAP.soldierMobility.values[L('soldierMobility')-1]:0)/100; }
  function shieldChanceForLevel(lvl){ return lvl>0?Math.min(28,8+lvl*4):0; }
  function cannonChanceForLevel(lvl){ return lvl>=2?Math.min(19,4+lvl*3):0; }
  function getShieldBulkChancePct(){ return shieldChanceForLevel(L('soldierDurability')); }
  function getBlastCannonChancePct(){ return cannonChanceForLevel(L('soldierDamage')); }
  function getFormationBalancePressure(){
    const shield=Math.max(0,L('soldierDurability')-1)/4;
    const cannon=Math.max(0,L('soldierDamage')-2)/3;
    return Math.max(0,Math.min(1,(shield+cannon)/2));
  }
  function getLaserPodCount(){
    const l=L('baseLaser');
    return l<=0?0:l>=5?4:l>=4?3:l>=3?2:1;
  }
  function getLaserPodPositions(){
    const count=getLaserPodCount();
    if(!base || count<=0) return [];
    const rr=base.radius+24;
    return Array.from({length:count},(_,i)=>{
      const a=-Math.PI/2+i*Math.PI*2/count;
      return {x:base.x+Math.cos(a)*rr,y:base.y+Math.sin(a)*rr,angle:a};
    });
  }
  // pickupRadius ID는 저장 호환을 위해 유지하지만, 실제 표시 이름은 '커서 자석'이다.
  function getPickupRadius(){ return 24*(1+(L('pickupRadius')>0?SKILL_MAP.pickupRadius.values[L('pickupRadius')-1]:0)/100); }
  function getOperationDuration(){ const l=L('operationDuration'); return 15+(l>0?SKILL_MAP.operationDuration.values[l-1]-15:0); }
  function getManualSpawnInterval(){
    // 초반은 느리게 시작하고, 소환 속도/자동 생산/예비 병력 투자 후 후반 체감이 크게 달라지도록 설정
    const baseManualSpawnInterval = 2.2;
    let interval = baseManualSpawnInterval*(1-(L('summonSpeed')>0?SKILL_MAP.summonSpeed.values[L('summonSpeed')-1]:0)/100);
    if(overloadTimer>0) interval *= 0.40;
    return Math.max(baseManualSpawnInterval*0.45, interval);
  }
  function getAutoSpawnInterval(){
    const l=L('autoProduction'); if(l<=0) return null;
    let interval=SKILL_MAP.autoProduction.values[l-1];
    if(overloadTimer>0) interval*=0.60;
    return interval;
  }
  function getReserveForceEvery(){ const l=L('reserveForce'); return l>0?SKILL_MAP.reserveForce.values[l-1]:0; }
  function getEmergencyRepairHealPct(){ const l=L('emergencyRepair'); return l>0?SKILL_MAP.emergencyRepair.values[l-1]:0; }
  function getFocusFireBonusPct(){ const l=L('focusFire'); return l>0?SKILL_MAP.focusFire.values[l-1]:0; }
  function getAssaultCommand(){ const l=L('assaultCommand'); if(l<=0) return null;

  function getGoldMultiplier(eliteMult){
    // 골드 획득 스킬은 여기서 직접 곱하지 않는다.
    // 노란 코인을 모을 때만 별도의 소수점 누적 방식으로 처리한다.
    let m = 1;
    const cbMax = getChainBountyMaxPct();
    if(cbMax>0){ const tier=Math.min(5,Math.floor(comboCount/5)); m *= (1+(cbMax/5*tier)/100); }
    m *= (eliteMult||1);

  // ============================================================
  // 5) 스킬트리 렌더링 (점진적 공개 + 팬/줌 + 상세 패널)
  // ============================================================
  const SVGNS='http://www.w3.org/2000/svg';
  const TREE_W=1280, TREE_H=760;
  let zoom=1, panX=0, panY=0;

  function fitTree(){
    const vw = treeViewport.clientWidth||900, vh = treeViewport.clientHeight||600;
    zoom = Math.max(0.3, Math.min(vw/TREE_W, vh/TREE_H)*0.94);
    panX = (vw - TREE_W*zoom)/2;
    panY = (vh - TREE_H*zoom)/2;
    applyTreeTransform();
  }
  function applyTreeTransform(){ treeSvgWrap.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+zoom+')'; }
  function clampZoom(z){ return Math.max(0.3, Math.min(2.2, z)); }
  function zoomAtPoint(clientX, clientY, factor){
    const rect = treeViewport.getBoundingClientRect();
    const mx = clientX-rect.left, my = clientY-rect.top;
    const worldX = (mx-panX)/zoom, worldY=(my-panY)/zoom;
    zoom = clampZoom(zoom*factor);
    panX = mx-worldX*zoom; panY = my-worldY*zoom;
    applyTreeTransform();
  }
  let dragging=false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0, dragMoved=false;
  treeViewport.addEventListener('mousedown', (e)=>{
    dragging=true; dragMoved=false; dragStartX=e.clientX; dragStartY=e.clientY; panStartX=panX; panStartY=panY;
    treeViewport.classList.add('grabbing');
  });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    if(Math.abs(e.clientX-dragStartX)>3 || Math.abs(e.clientY-dragStartY)>3) dragMoved=true;
    panX = panStartX+(e.clientX-dragStartX); panY = panStartY+(e.clientY-dragStartY);
    applyTreeTransform();
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; treeViewport.classList.remove('grabbing'); });
  treeViewport.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    dragging=true; dragMoved=false; dragStartX=e.touches[0].clientX; dragStartY=e.touches[0].clientY; panStartX=panX; panStartY=panY;
  }, {passive:true});
  treeViewport.addEventListener('touchmove', (e)=>{
    if(!dragging || e.touches.length!==1) return;
    if(Math.abs(e.touches[0].clientX-dragStartX)>3 || Math.abs(e.touches[0].clientY-dragStartY)>3) dragMoved=true;
    panX = panStartX+(e.touches[0].clientX-dragStartX); panY = panStartY+(e.touches[0].clientY-dragStartY);
    applyTreeTransform();
  }, {passive:true});
  treeViewport.addEventListener('touchend', ()=>{ dragging=false; });
  treeViewport.addEventListener('wheel', (e)=>{ e.preventDefault(); zoomAtPoint(e.clientX, e.clientY, e.deltaY<0?1.12:0.89); }, {passive:false});
  zoomInBtn.addEventListener('click', ()=>{ const r=treeViewport.getBoundingClientRect(); zoomAtPoint(r.left+r.width/2, r.top+r.height/2, 1.2); });
  zoomOutBtn.addEventListener('click', ()=>{ const r=treeViewport.getBoundingClientRect(); zoomAtPoint(r.left+r.width/2, r.top+r.height/2, 0.83); });
  zoomResetBtn.addEventListener('click', fitTree);

  function el(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) if(attrs[k]!==undefined) e.setAttribute(k,attrs[k]); return e; }

  function buildTree(){
    treeSvgWrap.innerHTML='';
    const svg = el('svg', {id:'treeSvg', viewBox:'0 0 '+TREE_W+' '+TREE_H, width:TREE_W, height:TREE_H});
    svg.appendChild(el('rect',{x:0,y:0,width:TREE_W,height:TREE_H,fill:'#080b10'}));
    for(let x=0;x<=TREE_W;x+=50) svg.appendChild(el('line',{x1:x,y1:0,x2:x,y2:TREE_H,stroke:'rgba(79,163,227,0.05)','stroke-width':1}));
    for(let y=0;y<=TREE_H;y+=50) svg.appendChild(el('line',{x1:0,y1:y,x2:TREE_W,y2:y,stroke:'rgba(79,163,227,0.05)','stroke-width':1}));

    // 연결선: 공개된 자식으로 향하는 선만 그린다 (부모-자식 중앙 연결, 노드 뒤에 렌더)
    SKILLS.forEach(s=>{
      if(!s.parent) return;
      if(!isRevealed(s.id)) return; // 아직 공개 안 된 자식으로 가는 선은 표시하지 않음
      const p = SKILL_MAP[s.parent];
      const owned = L(s.parent)>0 && L(s.id)>0;
      const justRevealed = justRevealedIds.indexOf(s.id)>=0;
      const line = el('line',{class:'tr-edge'+(owned?' owned':'')+(justRevealed?' reveal-anim':''),
        x1:p.pos.x, y1:p.pos.y, x2:s.pos.x, y2:s.pos.y});
      svg.appendChild(line);
    });

    // 노드: 공개된 것만 렌더
    SKILLS.forEach(s=>{ if(isRevealed(s.id)) svg.appendChild(buildNode(s)); });

    treeSvgWrap.appendChild(svg);

    if(justRevealedIds.length){
      const names = justRevealedIds.map(id=>SKILL_MAP[id].name).join(', ');
      showToast('새 스킬 해금: '+names);
    }
    justRevealedIds = [];
    justUnlockedId = null;
    justLeveledId = null;
  }

  function buildNode(s){
    const state = nodeState(s);
    const cost = nextCost(s);
    const affordable = state!=='maxed' && cost!==null && hasEnoughGold(cost);
    let fill, stroke;
    if(state==='maxed'){
      fill='#263a2e'; stroke='#62d79b';
    } else if(affordable){
      // 지금 바로 업그레이드 가능한 노드: 노란색
      fill='#e8a33d'; stroke='#ffe0a0';
    } else {
      // 골드가 부족한 노드: 빨간색
      fill='#3a1719'; stroke='#e0483f';
    }
    const w=76, h=56;
    const cls = ['sk-node','state-'+state];
    if(s.id===justUnlockedId) cls.push('unlock-pop');
    if(s.id===justLeveledId) cls.push('level-flash');
    const g = el('g',{class:cls.join(' ')});
    // 넉넉한 터치 영역
    g.appendChild(el('rect',{x:s.pos.x-w/2-8,y:s.pos.y-h/2-8,width:w+16,height:h+16,fill:'transparent'}));
    g.appendChild(el('rect',{class:'box', x:s.pos.x-w/2, y:s.pos.y-h/2, width:w, height:h, rx:10, fill, stroke}));
    if(state==='maxed') g.appendChild(el('rect',{class:'max-ring', x:s.pos.x-w/2-4, y:s.pos.y-h/2-4, width:w+8, height:h+8, rx:12}));
    const icon = el('text',{class:'icon-t', x:s.pos.x, y:s.pos.y-8}); icon.textContent=s.icon; g.appendChild(icon);
    const lvl = el('text',{class:'lvl-t', x:s.pos.x, y:s.pos.y+14}); lvl.textContent=L(s.id)+'/'+s.maxLevel; g.appendChild(lvl);
    const name = el('text',{class:'name-t', x:s.pos.x, y:s.pos.y+h/2+15}); name.textContent=s.name; g.appendChild(name);
    g.style.cursor='pointer';
    g.addEventListener('mouseenter', ()=> showSkillPreview(s.id));
    g.addEventListener('mouseleave', hideSkillPreview);
    g.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(dragMoved) return;
      const lvl = L(s.id);
      if(lvl>=s.maxLevel){ showToast(s.name+'은(는) 이미 MAX 레벨입니다.'); return; }
      const cost = nextCost(s);
      if(!hasEnoughGold(cost)){ showToast('골드가 부족합니다. 필요: '+cost); return; }
      if(buySkill(s.id)){
        const newLvl = L(s.id);
        renderLobby();
        showSkillPreview(s.id);
        showToast(s.name+' Lv.'+newLvl+' 업그레이드!');
      }
    });
    return g;
  }

  function showSkillPreview(id){
    const s = SKILL_MAP[id]; const lvl = L(id); const maxed = lvl>=s.maxLevel;
    let html = '<div class="p-head"><div><div class="p-name">'+s.icon+' '+s.name+'</div>'+
      '<div class="p-lvl">Lv.'+lvl+' / '+s.maxLevel+'</div></div></div>';
    html += '<div class="p-desc">'+s.desc+'</div>';

    if(id==='operationDuration'){
      const cur = lvl>0 ? s.values[lvl-1]+'초' : '15초';
      const next = !maxed ? s.values[lvl]+'초' : null;
      html += '<div class="p-effect">'+
        (next
          ? '<div class="change"><span class="from">'+cur+'</span><span class="arrow">→</span><span class="to">'+next+'</span></div>'
          : '<div class="change"><span class="from">'+cur+'</span></div>')+
        '</div>';
    } else {
      const curTxt = lvl>0 ? effectText(s,lvl) : '효과 없음';
      const nextTxt = !maxed ? effectText(s,lvl+1) : null;
      html += '<div class="p-effect">'+
        (nextTxt
          ? '<div class="change"><span class="from">'+curTxt+'</span><span class="arrow">→</span><span class="to">'+nextTxt+'</span></div>'
          : '<div class="change"><span class="from">'+curTxt+'</span></div>')+
        '</div>';
    }

    if(maxed){
      html += '<div class="p-max">MAX 레벨</div>';
    } else {
      const cost = nextCost(s);
      html += '<div class="p-reason">필요 골드: '+cost+'</div>';
    }
    panelBody.innerHTML = html;
    skillPanel.classList.add('open');

  function rebuildAmbientField(){

    ambientStars=Array.from({length:count},(_,i)=>({

  function getVisualTier(){
    const level=totalLevel();
    let skillTier=0;
    if(level>=75) skillTier=5;
    else if(level>=56) skillTier=4;
    else if(level>=38) skillTier=3;
    else if(level>=21) skillTier=2;
    else if(level>=8) skillTier=1;

    // 긴 작전의 중반부터 전장 밀도와 실제 공격 효과가 빠르게 상승한다.
    let roundTier=0;
    if(ROUND_DURATION>=40){
      if(elapsed>=34) roundTier=5;
      else if(elapsed>=26) roundTier=4;
      else if(elapsed>=20) roundTier=3;
      else if(elapsed>=14) roundTier=2;
      else if(elapsed>=8) roundTier=1;
    } else if(ROUND_DURATION>=30){
      if(elapsed>=27) roundTier=4;
      else if(elapsed>=21) roundTier=3;
      else if(elapsed>=14) roundTier=2;
      else if(elapsed>=8) roundTier=1;
    } else if(ROUND_DURATION>=20){
      if(elapsed>=16) roundTier=2;
      else if(elapsed>=8) roundTier=1;
    }
    return Math.max(skillTier,roundTier);
  }

  // 신규 유저의 초반 난이도는 거의 그대로이며, 45초·고레벨 작전에서만 기지와 병사 피해가 크게 상승한다.
  function getThreatProfile(){
    // 방어 스킬을 구매했다고 적까지 강해지지 않는다. 위협도는 방어 가지를 제외한 성장량으로 계산한다.
    const level=totalLevel()-L('baseDurability')-L('soldierDurability')-L('emergencyRepair');
    const progression=Math.max(0,Math.min(1,(level-25)/46));
    const phase=Math.max(0,Math.min(1,currentPhaseIndex()/6));
    const duration=Math.max(0,Math.min(1,((ROUND_DURATION||15)-25)/20));
    // 혼합 편성은 전선 유지력과 범위 화력을 높이므로, 고레벨에서만 적 체력·밀도를 소폭 보정한다.
    const formation=getFormationBalancePressure();
    return {
      hp:1+progression*.18+phase*.12+formation*.06,
      soldierDamage:1+progression*.45+phase*.25+formation*.04,
      baseDamage:1+progression*.65+phase*.35+duration*.10+formation*.025,
      density:1+progression*.28+phase*.22+formation*.08
    };
  }

  function getCommanderSpawnTime(){
    return Math.max(27,(ROUND_DURATION||40)-15);
  }

  function isOmegaVolleyUnlocked(){
    return L('focusFire')>=3 && L('assaultCommand')>=3 && soldiers.length>=8;
  }

  function addScreenShake(amount){
    screenShake=Math.min(22,Math.max(screenShake,amount));
  }

  function addScreenFlash(color,alpha){
    screenFlashCss=color||'#ffffff';
    screenFlashAlpha=Math.max(screenFlashAlpha,alpha||0.2);
  }

  function pushFx(p){
    particles.push(p);
    if(particles.length>980) particles.splice(0,particles.length-980);
  }

  function spawnRadialBurst(x,y,color,count,speed,size){
    count=Math.max(3,count||8); speed=speed||100; size=size||2;
    for(let i=0;i<count;i++){
      const a=Math.PI*2*i/count+(Math.random()-0.5)*0.35;
      const sp=speed*(0.55+Math.random()*0.75);
      pushFx({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,drag:3.6,
        size:size*(0.6+Math.random()),color,life:0.28+Math.random()*0.32,t:0,
        type:'shard',rot:a,spin:(Math.random()-0.5)*10});
    }
  }

  function spawnCombatTracer(x1,y1,x2,y2,color,heavy){
    const tier=getVisualTier();
    if(tier<=0) return;
    pushFx({x:x1,y:y1,x2,y2,color,life:heavy?0.18:0.11,t:0,type:'tracer',
      width:(heavy?3.8:1.6)+tier*0.22});
    if(tier>=2){
      pushFx({x:x1,y:y1,r:2,max:8+tier*1.5,color,life:0.12,t:0,type:'ring'});
    }
    if(tier>=3){
      const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;
      const nx=-dy/d,ny=dx/d;
      pushFx({x:x1+dx*0.45+nx*(Math.random()-0.5)*5,
        y:y1+dy*0.45+ny*(Math.random()-0.5)*5,
        vx:dx/d*35,vy:dy/d*35,drag:5,size:1.4,color,life:0.18,t:0,type:'shard',rot:Math.atan2(dy,dx)});
    }
  }

  function spawnEnemyEntranceFx(en){
    const tier=getVisualTier();

    if(tier>=2 || en.elite) spawnRadialBurst(en.x,en.y,color,en.kind==='commander'?22:6+tier,70+tier*18,2);

  function syncCollectorRobots(){
    const cfg=getCollectorRobot();
    coinDrones=[];
    if(!cfg) return;
    for(let i=0;i<cfg.count;i++){
      const a=Math.PI*2*i/cfg.count;
      coinDrones.push({x:base.x+Math.cos(a)*62,y:base.y+Math.sin(a)*62,
        angle:a,facing:a+Math.PI/2,target:null,flash:0,beamPulse:Math.random()*Math.PI*2,cargo:0});
    }
  }

  function releaseDroneTarget(coin){
    for(const d of coinDrones){ if(d.target===coin) d.target=null; }
  }

  function updateCollectorRobots(dt){
    const cfg=getCollectorRobot();
    if(!cfg || coinDrones.length===0) return;
    const reserved=new Set(coinDrones.map(d=>d.target).filter(Boolean));
    for(let i=0;i<coinDrones.length;i++){
      const d=coinDrones[i];
      d.flash=Math.max(0,d.flash-dt*4);
      d.beamPulse+=dt*6;
      if(!d.target || coins.indexOf(d.target)===-1 || d.target.t<d.target.popDur){
        d.target=null;
        let best=null,bestDist=Infinity;
        for(const c of coins){
          if(c.t<c.popDur || reserved.has(c)) continue;
          const dist=Math.hypot(c.tx-d.x,c.ty-d.y);
          const baseDist=Math.hypot(c.tx-base.x,c.ty-base.y);
          if(baseDist<=cfg.range && dist<bestDist){bestDist=dist;best=c;}
        }
        if(best){d.target=best;reserved.add(best);}
      }
      if(d.target){
        const dx=d.target.tx-d.x,dy=d.target.ty-d.y,dist=Math.hypot(dx,dy)||1;
        const speed=cfg.speed*(1+Math.min(.55,dist/500));
        const move=Math.min(dist,speed*dt);
        d.facing=Math.atan2(dy,dx)+Math.PI/2;
        d.x+=dx/dist*move;d.y+=dy/dist*move;
        if(dist<=10){
          d.target.droneCollected=true;
          d.target.droneCollector=d;
          d.flash=1;d.cargo++;
          if(d.cargo%8===0){
            pushFx({x:d.x,y:d.y,r:4,max:86,color:'#72ffd0',life:.52,t:0,type:'ring'});
            spawnRadialBurst(d.x,d.y,'#72ffd0',16,110,2.2);
            spawnBanner(d.x,d.y-24,'회수 펄스!','#a8ffe2');
            addScreenShake(2.5);
            // 펄스는 주변 코인을 즉시 로봇 쪽으로 끌고, 근처 적에게 작은 실피해를 준다.
            for(const c of coins){
              if(c.t<c.popDur) continue;
              const cd=Math.hypot(c.tx-d.x,c.ty-d.y);
              if(cd<=145){ c.tx+=(d.x-c.tx)*.48; c.ty+=(d.y-c.ty)*.48; }
            }
            for(const en of enemies){
              const ed=Math.hypot(en.x-d.x,en.y-d.y);
              if(ed<=125) en.hp-=6+L('collectorDrone')*4;
            }
          }
        }
      } else {
        d.angle+=dt*(.55+i*.04);
        const rr=60+i*9+Math.sin(elapsed*1.8+i)*4;
        const tx=base.x+Math.cos(d.angle)*rr,ty=base.y+Math.sin(d.angle)*rr;
        const dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy)||1;
        const move=Math.min(dist,cfg.speed*.52*dt);
        d.facing=Math.atan2(dy,dx)+Math.PI/2;
        d.x+=dx/dist*move;d.y+=dy/dist*move;
      }
    }
  }

  function chooseLaserTargets(count){
    const pool=enemies.filter(en=>en.hp>0).slice();
    pool.sort((a,b)=>{
      const pa=(a.kind==='commander'?1200:a.kind==='siege'?820:a.kind==='bomber'?760:a.elite?360:a.kind==='armored'?180:0)-Math.hypot(a.x-base.x,a.y-base.y)*.18;
      const pb=(b.kind==='commander'?1200:b.kind==='siege'?820:b.kind==='bomber'?760:b.elite?360:b.kind==='armored'?180:0)-Math.hypot(b.x-base.x,b.y-base.y)*.18;
      return pb-pa;
    });
    return pool.slice(0,count);
  }

  function updateBaseLaser(dt){
    baseLaserChargeFlash=Math.max(0,baseLaserChargeFlash-dt*5);
    const cfg=getBaseLaser();
    if(!cfg){baseLaserAimTargets=[];return;}
    if(enemies.length===0){baseLaserAimTargets=[];return;}
    const haste=commandAtkSpeedTimer>0?1.65:1;
    baseLaserTimer+=dt*haste;
    if(baseLaserTimer<cfg.interval) return;
    baseLaserTimer=0;baseLaserChargeFlash=1;baseLaserShotCount++;
    const targets=chooseLaserTargets(cfg.chains);
    baseLaserAimTargets=targets.map(t=>({x:t.x,y:t.y}));
    const pods=getLaserPodPositions();
    const pulses=L('baseLaser')>=5?2:1;
    for(let pulse=0;pulse<pulses;pulse++){
      targets.forEach((target,idx)=>{
        if(target.hp<=0) return;
        let dmg=cfg.damage*Math.pow(.84,idx)*(pulse===0?1:.42);
        if(target.kind==='commander') dmg*=1.18;
        if(target.invulnTimer>0) dmg=0;
        target.hp-=dmg;
        const source=pods.length?pods[idx%pods.length]:base;
        const color=pulse===0?(idx===0?'#7ff2ff':'#9bbcff'):'#ffffff';
        pushFx({x:source.x,y:source.y,x2:target.x,y2:target.y,color,life:pulse===0?.27:.16,t:-pulse*.035,type:'tracer',width:(pulse===0?6.4:3.2)-idx*.5});
        pushFx({x:target.x,y:target.y,r:4,max:31-idx*2,color,life:.30,t:0,type:'ring'});
        spawnRadialBurst(target.x,target.y,color,Math.max(4,10-idx),110,2.2);
        if(pulse===0) pushFx({x:target.x,y:target.y-12,text:'-'+Math.round(dmg),color,life:.48,t:0,type:'text',vy:-22,size:11,bold:true});
      });
    }
    if(L('baseLaser')>=4 && baseLaserShotCount%3===0){
      spawnBanner(base.x,base.y-72,'레이저 포드 과충전','#aef7ff');
      pushFx({x:base.x,y:base.y,r:base.radius,max:125,color:'#8eeeff',life:.45,t:0,type:'ring'});
    }
    addScreenShake(targets.length>=3?6:4);
    addScreenFlash('#8eeeff',targets.length>=3?.18:.10);
  }

  function spawnAssaultWave(phaseIdx){
    if(enemies.length>=MAX_ENEMIES-18) return;
    const readiness=getCombatReadiness();
    const firstEdge=Math.floor(Math.random()*4);
    const edges=[firstEdge];
    // 만렙에 가까운 장기 작전은 초반부터 반대편 전선도 동시에 열어 병력이 한쪽에 몰리지 않게 한다.
    if((phaseIdx>=5 && totalLevel()>=50) || (phaseIdx<=2 && readiness>=0.72)) edges.push((firstEdge+2)%4);
    const names=edges.map(e=>['북부','동부','남부','서부'][e]);
    const perEdge=Math.min(12,4+Math.floor(phaseIdx*1.45)+Math.floor(readiness*2));
    assaultWaveCount++;
    warnBanner.textContent='⚠ '+(edges.length>1?'양면 포위 공세':names[0]+' 집중 공세');warnBanner.classList.remove('show');void warnBanner.offsetWidth;warnBanner.classList.add('show');
    spawnBanner(base.x,base.y-82,(edges.length>1?names.join('·')+' 동시 접근':names[0]+' 전선')+' · '+(perEdge*edges.length)+'기','#ff786e');
    addScreenShake(5+phaseIdx*.9);
    addScreenFlash('#ff5b4f',phaseIdx>=5?.10:.05);
    for(const edge of edges){
      for(let i=0;i<perEdge;i++){
        let kind=null;
        if(phaseIdx>=3 && i===perEdge-1) kind='bomber';
        else if(phaseIdx>=4 && i===perEdge-2) kind='siege';
        else if(phaseIdx>=2 && i===perEdge-3) kind='armored';
        spawnEnemy(false,kind,edge);
      }
    }
  }

  function fmtTime(t){ t=Math.max(0,Math.ceil(t)); const m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  function getCombatReadiness(){
    // 성장한 계정일수록 45초 라운드의 초반부터 실제 전투가 시작된다.
    // 저레벨 계정은 기존의 완만한 입문 난이도를 거의 유지한다.
    return Math.max(0,Math.min(1,(totalLevel()-10)/65));
  }

  function currentPhaseIndex(){
    const duration=Math.max(15,ROUND_DURATION||15);
    // 40~45초 작전은 첫 15초가 한 단계에 묶이지 않도록 전체 시간을 비율로 나눈다.
    if(duration>=35){
      const ratio=elapsed/duration;
      if(ratio<0.12) return 0;
      if(ratio<0.24) return 1;
      if(ratio<0.38) return 2;
      if(ratio<0.52) return 3;
      if(ratio<0.67) return 4;
      if(ratio<0.82) return 5;
      return 6;
    }
    if(duration>=25){
      if(elapsed<5) return 0; if(elapsed<10) return 1; if(elapsed<15) return 2;
      if(elapsed<20) return 3; if(elapsed<25) return 4; if(elapsed<duration-2) return 5; return 6;
    }
    if(elapsed<5) return 0; if(elapsed<10) return 1; return 2;
  }

  function spawnOpeningPressure(){
    const readiness=getCombatReadiness();
    let count=1;
    if(ROUND_DURATION>=25) count=2+Math.round(readiness*5);
    if(ROUND_DURATION>=40) count+=Math.round(1+readiness*2);
    count=Math.min(10,count);
    for(let i=0;i<count;i++){
      let kind=null;
      if(readiness>=0.78 && i===count-1) kind='armored';
      else if(readiness>=0.52 && i%4===2) kind='fast';
      spawnEnemy(true,kind,i%4);
    }
    if(count>=6){
      spawnBanner(base.x,base.y-78,'초기 포위망 · '+count+'기 접근','#ff8a76');
      addScreenFlash('#ff6b57',0.08);
    }
  }

  function startRound(){
    resize();
    ROUND_DURATION = getOperationDuration();
    base = { x:cx, y:cy, radius:34, hp:0, maxHp:getBaseMaxHp() };
    base.hp = base.maxHp;
    enemies=[]; soldiers=[]; particles=[]; coins=[];
    gold=0; kills=0; elapsed=0; wave=1;
    timeLeft=ROUND_DURATION; earnedThisRound=0;
    spawnTimer=0; spawnInterval=1.0;
    autoTimer=0; running=true; holding=false; manualSpawnCooldown=0;
    // 새 라운드에서는 이전 화면의 커서 궤적을 이어 쓰지 않는다.
    cursorTrail=[];
    PICKUP_RADIUS=getPickupRadius();
    manualSpawnCount=0;
    repairUsedThisRound=false; repairActive=false; repairTimer=0; repairGuardTimer=0;
    comboCount=0; comboTimer=0;
    coinPityBonus=0;
    commanderSpawned=false; commanderDefeated=false; commanderBonus=0; burstTimer=4;
    commandState = ROUND_DURATION>=25 ? 'idle' : 'none';
    commandTimer=0; commandAtkSpeedTimer=0; overloadTimer=0; manualLockTimer=0;
    gameSpeedMult=1;
    roundEnding=false; roundEndGrace=0;
    screenShake=0; screenShakeX=0; screenShakeY=0;
    screenFlashAlpha=0; damageVignetteAlpha=0; fxPulse=0;
    lastVisualTier=-1; commanderEntranceTimer=0;
    assaultWaveTimer=Math.max(4.1,6.8-getCombatReadiness()*2.7); assaultWaveCount=0;
    baseLaserTimer=0; baseLaserChargeFlash=0;baseLaserShotCount=0;baseLaserAimTargets=[];
    roundUnitAnnouncements=new Set();
    overtimeActive=false;overtimeUsed=false;omegaVolleyTimer=4.8;
    syncCollectorRobots();
    cmdBtn.classList.remove('show'); cmdPanel.classList.remove('show');
    phase='round';
    overlay.classList.remove('show');
    updateHud();
    spawnOpeningPressure();
  }

  function updateHud(){
    goldVal.textContent = Math.floor(gold);
    waveVal.textContent = wave;
    const unitCounts={rifler:0,shield:0,cannon:0};
    for(const s of soldiers) unitCounts[s.type||'rifler']=(unitCounts[s.type||'rifler']||0)+1;
    const mixText=soldiers.length?' · 소'+unitCounts.rifler+' 방'+unitCounts.shield+' 포'+unitCounts.cannon:'';
    troopVal.textContent = soldiers.length+mixText+(coinDrones.length?' · 회'+coinDrones.length:'');
    timeVal.textContent = overtimeActive ? 'OT '+fmtTime(timeLeft) : fmtTime(timeLeft);
    timeVal.classList.toggle('low', timeLeft<=5);
    const pct = Math.max(0, Math.min(100, (timeLeft/ROUND_DURATION)*100));
    roundBarFill.style.width = pct+'%';
    roundBarFill.style.background = timeLeft<=5 ? 'linear-gradient(90deg,#e0483f,#ff7a6e)' : 'linear-gradient(90deg,#3fbf7f,#e8a33d)';

    const tier=getVisualTier();
    fxTierValue.textContent=visualTierLabel(tier);
    fxTierBadge.className='tier-'+tier;
    if(tier!==lastVisualTier && lastVisualTier>=0 && tier>lastVisualTier){
      spawnBanner(base.x,base.y-92,'전투 출력 '+visualTierLabel(tier)+' 단계','#ffd06e');
      addScreenFlash('#6ebdff',0.10+tier*0.025);
    }
    lastVisualTier=tier;

    if(comboCount>1 && comboTimer>0){
      comboHudValue.textContent=(comboCount>=30?'ANNIHILATION ':comboCount>=15?'RAMPAGE ':comboCount>=8?'FURY ':'COMBO ')+'x'+comboCount;
      comboHud.classList.add('show');
    } else {
      comboHud.classList.remove('show');
    }

    const boss=enemies && enemies.find(en=>en.kind==='commander' && en.hp>0);
    if(boss){
      const ratio=Math.max(0,boss.hp/boss.maxHp);
      bossHud.classList.add('show');
      bossHudFill.style.width=(ratio*100).toFixed(1)+'%';
      bossHpText.textContent=Math.ceil(ratio*100)+'%';
    } else {
      bossHud.classList.remove('show');
    }

    dangerVignetteAlpha=Math.max(damageVignetteAlpha,base&&base.hp/base.maxHp<0.3?(0.18+(1-base.hp/base.maxHp)*0.38):0);
    dangerVignette.style.opacity=Math.max(0,Math.min(.8,dangerVignetteAlpha)).toFixed(3);
    screenFlashDom.style.background=screenFlashCss;
    screenFlashDom.style.opacity=Math.max(0,Math.min(1,screenFlashAlpha)).toFixed(3);
  }

  function pointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    if(e.touches && e.touches.length) return {x:e.touches[0].clientX-rect.left, y:e.touches[0].clientY-rect.top};
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }
  function cursorIsAvailable(x,y){
    return Number.isFinite(x) && Number.isFinite(y) && x>-9000 && y>-9000;
  }
  function setCursorPoint(p){
    const now=performance.now()/1000;
    // 화면에 새로 들어왔을 때 이전 위치와 이어지는 긴 가짜 선분이 생기지 않게 궤적을 초기화한다.
    if(!cursorIsAvailable(mouseX,mouseY)) cursorTrail=[];
    mouseX=p.x; mouseY=p.y;

    const lastPoint=cursorTrail[cursorTrail.length-1];
    if(!lastPoint || Math.hypot(lastPoint.x-p.x,lastPoint.y-p.y)>0.25){
      cursorTrail.push({x:p.x,y:p.y,t:now});
      if(cursorTrail.length>64) cursorTrail.splice(0,cursorTrail.length-64);
    } else {
      lastPoint.t=now;
    }
  }
  function pointToSegmentDistance(px,py,ax,ay,bx,by){
    const abx=bx-ax, aby=by-ay;
    const lenSq=abx*abx+aby*aby;
    if(lenSq<=0.0001) return Math.hypot(px-ax,py-ay);
    const t=Math.max(0,Math.min(1,((px-ax)*abx+(py-ay)*aby)/lenSq));
    const qx=ax+abx*t, qy=ay+aby*t;
    return Math.hypot(px-qx,py-qy);
  }
  function pruneCursorTrail(now){
    const cutoff=now-CURSOR_TRAIL_LIFETIME;
    while(cursorTrail.length>1 && cursorTrail[1].t<cutoff) cursorTrail.shift();
  }
  function distanceToRecentCursorPath(px,py){
    if(!cursorIsAvailable(mouseX,mouseY)) return Infinity;
    if(cursorTrail.length===0) return Math.hypot(px-mouseX,py-mouseY);
    if(cursorTrail.length===1) return Math.hypot(px-cursorTrail[0].x,py-cursorTrail[0].y);

    let best=Infinity;
    for(let i=1;i<cursorTrail.length;i++){
      const a=cursorTrail[i-1], b=cursorTrail[i];
      const d=pointToSegmentDistance(px,py,a.x,a.y,b.x,b.y);
      if(d<best) best=d;
    }
    return Math.min(best,Math.hypot(px-mouseX,py-mouseY));
  }

  function spawnEnemy(closeStart, forcedKind, forcedEdge){
    let x,y;
    if(closeStart){
      const edgeAngles=[-Math.PI/2,0,Math.PI/2,Math.PI];
      const ang = Number.isInteger(forcedEdge)
        ? edgeAngles[((forcedEdge%4)+4)%4]+(Math.random()-.5)*0.72

      y = base.y+Math.sin(ang)*openingRadius;
    } else {
      const edge = Number.isInteger(forcedEdge)?forcedEdge:Math.floor(Math.random()*4), pad=20;
      const cluster=Number.isInteger(forcedEdge);
      const spreadX=Math.max(80,W*.22),spreadY=Math.max(80,H*.22);
      if(edge===0){ x=cluster?cx+(Math.random()-.5)*spreadX:Math.random()*W; y=-pad; }
      else if(edge===1){ x=W+pad; y=cluster?cy+(Math.random()-.5)*spreadY:Math.random()*H; }
      else if(edge===2){ x=cluster?cx+(Math.random()-.5)*spreadX:Math.random()*W; y=H+pad; }
      else { x=-pad; y=cluster?cy+(Math.random()-.5)*spreadY:Math.random()*H; }
    }
    const phaseIdx = currentPhaseIndex();
    const t = elapsed/25;
    let hp = 15+wave*3.8+t*5.5, speed = 36+Math.random()*13+Math.min(28,wave*1.2), dmg = 6.5+Math.min(18,wave*0.65)+phaseIdx*0.75;
    if(phaseIdx===0){hp*=0.94;dmg*=0.82;}
    const goldBase = 1;
    let kind = forcedKind || 'normal';
    if(!forcedKind){
      const roll = Math.random();
      const readiness=getCombatReadiness();
      // 성장 계정에서는 첫 10초부터 속도형·장갑형이 섞여 기본 적이 출현 즉시 삭제되는 현상을 줄인다.
      if(phaseIdx>=6){
        if(roll<0.20) kind='fast';
        else if(roll<0.39) kind='armored';
        else if(roll<0.51) kind='siege';
        else if(roll<0.64) kind='bomber';
      } else if(phaseIdx>=4){
        if(roll<0.21) kind='fast';
        else if(roll<0.39) kind='armored';
        else if(roll<0.49) kind='siege';
        else if(roll<0.59) kind='bomber';
      } else if(phaseIdx>=2){
        if(roll<0.22) kind='fast';
        else if(roll<0.37) kind='armored';
        else if(roll<0.44) kind='siege';
        else if(phaseIdx>=3 && roll<0.50) kind='bomber';
      } else if(phaseIdx===1){
        if(roll<0.20+readiness*0.07) kind='fast';
        else if(readiness>=0.45 && roll<0.20+readiness*0.20) kind='armored';
        else if(readiness>=0.78 && roll<0.20+readiness*0.25) kind='bomber';
      } else if(readiness>=0.40){
        if(roll<0.10+readiness*0.10) kind='fast';
        else if(readiness>=0.70 && roll<0.10+readiness*0.20) kind='armored';
      }
    }
    if(kind==='siege'){
      const siegeCap=phaseIdx>=6?7:phaseIdx>=5?6:phaseIdx>=3?4:2;
      if(enemies.filter(en=>en.kind==='siege'&&en.hp>0).length>=siegeCap) kind='armored';
    }
    if(kind==='fast'){ speed*=1.72; hp*=0.82; dmg*=0.92; }
    if(kind==='armored'){ hp*=2.4; speed*=0.64; dmg*=1.18; }
    if(kind==='siege'){ hp*=1.7; speed*=0.58; dmg*=1.0; }
    if(kind==='bomber'){ hp*=0.78; speed*=2.05; dmg*=1.38; }
    let elite=false, eliteMult=1;
    if(kind!=='commander' && Math.random()*100 < getEliteChancePct(phaseIdx)){
      elite=true; hp*=2.4; dmg*=1.4; speed*=0.9; eliteMult=2;
    }

    // 병력이 크게 누적된 고레벨 전투에서는 초반 적이 한 발에 사라지지 않도록 체력만 완만하게 보정한다.
    const armyPressure=Math.max(0,Math.min(1,((soldiers&&soldiers.length)||0)-8)/42);
    hp*=1+armyPressure*(phaseIdx<=2?0.34:0.20);
    const rawDmg=dmg;
    dmg=rawDmg*threat.baseDamage;
    let soldierDmg=rawDmg*threat.soldierDamage*0.42, soldierAtkInterval=0.72, soldierHitCount=1;
    let baseAttackRange=base.radius+8, baseAtkInterval=1.15;

    else if(kind==='siege'){ soldierDmg=rawDmg*threat.soldierDamage*0.40; soldierAtkInterval=1.05; baseAttackRange=165; baseAtkInterval=1.85; }
    else if(kind==='bomber'){ soldierDmg=0; soldierAtkInterval=9; soldierHitCount=0; baseAtkInterval=9; }
    else if(kind==='commander'){ soldierDmg=rawDmg*threat.soldierDamage*0.58; soldierAtkInterval=.88; soldierHitCount=5; baseAtkInterval=.86; }
    if(elite && soldierHitCount<2) soldierHitCount=2;
    soldierDmg=Math.max(2.2, soldierDmg);

    const spawnedEnemy={x,y,hp,maxHp:hp,speed,dmg,gold:goldBase,atkCd:Math.random()*.35,
      elite:(elite||kind==='commander'),eliteMult,kind,phaseIdx,

      detonated:false,specialCd:kind==='commander'?2.4:0,bossBreak1:false,bossBreak2:false,armorFlash:0,invulnTimer:0};
    enemies.push(spawnedEnemy);
    spawnEnemyEntranceFx(spawnedEnemy);
  }

  function applyGoldGainAccumulator(c, baseGained, popX, popY){
    // 색깔 코인은 제외하고 일반 노란 코인에만 적용한다.
    if(!c || c.coinType!=='yellow') return 0;

    // 부동소수점 오차로 0.999999...에서 지급이 늦어지는 일을 막는다.
    const bonus=Math.floor(meta.goldGainRemainder+1e-9);

    meta.goldGainRemainder=Math.max(0,meta.goldGainRemainder-bonus);

    spawnBonusGoldPop(popX,popY,bonus);

  function spawnEnemyCoinDrops(defeated){
    const lateBonus=defeated.phaseIdx>=6?3:defeated.phaseIdx>=5?2:defeated.phaseIdx>=4?1:0;
    let count=1+(defeated.phaseIdx>=3?1:0);
    if(defeated.kind==='commander') count=42+Math.floor(Math.random()*15); // 42~56개
    else if(defeated.kind==='siege') count=6+lateBonus;
    else if(defeated.kind==='armored') count=5+lateBonus;
    else if(defeated.kind==='fast') count=3+lateBonus;
    else if(defeated.kind==='bomber') count=3+lateBonus;
    if(defeated.elite && defeated.kind!=='commander') count+=3;

    // 색깔 코인 확률은 적 한 마리당 한 번만 판정한다.

      pushFx({x:defeated.x,y:defeated.y,r:10,max:120,color:'#e8a33d',life:0.72,t:0,type:'ring'});

    }

  function separate(units,minDist){
    for(let i=0;i<units.length;i++) for(let j=i+1;j<units.length;j++){
      const a=units[i], b=units[j]; const dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy);
      const desired=Number.isFinite(minDist)?minDist:Math.max(16,(a.bodyRadius||8)+(b.bodyRadius||8)+2);
      if(d<desired){ if(d===0)d=0.01; const ov=(desired-d)/2, nx=dx/d, ny=dy/d; a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov; }
    }
  }
