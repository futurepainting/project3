  function activateEmergencyRepair(fromLethalHit){
    if(repairUsedThisRound || L('emergencyRepair')<=0) return false;
    repairUsedThisRound=true;
    repairActive=true;
    repairTimer=4;
    repairGuardTimer=fromLethalHit?0.75:0;
    const healPct=getEmergencyRepairHealPct();
    repairPerSec=(base.maxHp*healPct/100)/4;
    if(fromLethalHit) base.hp=Math.max(1,base.hp);
    spawnBanner(base.x, base.y-60, fromLethalHit?'비상 수리 · 치명타 방어':'비상 수리 가동', '#3fbf7f');
    for(let r=0;r<3;r++) pushFx({x:base.x,y:base.y,r:base.radius+r*10,max:105+r*22,color:r===1?'#b6fff0':'#3fbf7f',life:.65+r*.12,t:-r*.05,type:'ring'});
    spawnRadialBurst(base.x,base.y,'#72ffc3',24,125,2.3);
    addScreenFlash('#5dffc0',.18);addScreenShake(5);
    return true;
  }

  function triggerBossPhaseBreak(en,phaseNo){
    const ratio=en.hp/en.maxHp;
    const coinCount=phaseNo===1?10:16;
    en.armorFlash=1;en.invulnTimer=1.05;
    spawnBanner(en.x,en.y-45,phaseNo===1?'지휘관 장갑 파괴!':'지휘관 코어 노출!','#ffcf68');
    for(let r=0;r<4;r++) pushFx({x:en.x,y:en.y,r:8+r*9,max:95+r*22,color:r%2?'#ffd36d':'#ff554d',life:.55+r*.10,t:-r*.035,type:'ring'});
    spawnRadialBurst(en.x,en.y,'#ffd16a',30+phaseNo*8,175,2.8);
    for(let i=0;i<coinCount;i++) spawnCoin(en.x,en.y,1,1,{coinType:i===coinCount-1&&phaseNo===2?'blue':'yellow',minDist:28,maxDist:118,popDur:.48+Math.random()*.12});
    const edge=Math.floor(Math.random()*4);
    const adds=phaseNo===1?5:8;
    for(let i=0;i<adds;i++) spawnEnemy(false,i===adds-1?'bomber':(i===adds-2?'armored':null),edge);
    addScreenFlash('#ffd06a',phaseNo===1?.30:.42);addScreenShake(phaseNo===1?11:16);
  }

  function damageBase(amount){
    if(repairGuardTimer>0) return;
    if(base.hp-amount<=0 && !repairUsedThisRound && L('emergencyRepair')>0){
      base.hp=1;
      activateEmergencyRepair(true);
      return;
    }
    base.hp-=amount;
  }

  function update(rawDt){
    if(!running) return;
    if(commandState==='open'){ commandTimer -= rawDt; if(commandTimer<=0) closeCommandUI(); }
    const dt = rawDt*gameSpeedMult;
    elapsed += dt;
    screenShake=Math.max(0,screenShake-dt*16);
    screenFlashAlpha=Math.max(0,screenFlashAlpha-dt*2.8);
    damageVignetteAlpha=Math.max(0,damageVignetteAlpha-dt*1.6);
    commanderEntranceTimer=Math.max(0,commanderEntranceTimer-dt);
    fxPulse+=dt;

    if(!roundEnding){
      timeLeft -= dt;
      if(timeLeft<=0){
        const livingBoss=enemies.find(en=>en.kind==='commander'&&en.hp>0);
        if(livingBoss && !overtimeUsed){
          overtimeUsed=true;overtimeActive=true;timeLeft=8;
          warnBanner.textContent='⚠ 지휘관 격파 오버타임';warnBanner.classList.remove('show');void warnBanner.offsetWidth;warnBanner.classList.add('show');
          spawnBanner(base.x,base.y-82,'OVERTIME · 8초','#ffcf68');
          addScreenFlash('#ff674f',.34);addScreenShake(12);
        } else {
          timeLeft=0;roundEnding=true;roundEndGrace=1.8;
        }
      }
    }
    updateHud();
    if(roundEnding){
      roundEndGrace -= dt;
      if(roundEndGrace<=0){ endRound(true); return; }
    }

    maybeShowCommandBtn();
    comboTimer=Math.max(0,comboTimer-dt); if(comboTimer<=0) comboCount=0;
    commandAtkSpeedTimer=Math.max(0,commandAtkSpeedTimer-dt);
    if(overloadTimer>0){ overloadTimer-=dt; if(overloadTimer<=0){ overloadTimer=0; manualLockTimer=1; } }
    else if(manualLockTimer>0){ manualLockTimer=Math.max(0,manualLockTimer-dt); }

    repairGuardTimer=Math.max(0,repairGuardTimer-dt);
    if(repairActive){
      base.hp=Math.min(base.maxHp, base.hp+repairPerSec*dt); repairTimer-=dt;
      if(repairTimer<=0) repairActive=false;
    }
    if(!repairUsedThisRound && L('emergencyRepair')>0 && base.hp<=base.maxHp*0.3){
      activateEmergencyRepair(false);
    }

    const phaseIdx = currentPhaseIndex();
    if(!roundEnding){
      const readiness=getCombatReadiness();
      const phaseIntervals=[1.08,0.78,0.59,0.46,0.36,0.30,0.26];
      const earlyWeight=Math.max(0,1-elapsed/18);
      // 만렙 장기 작전은 초반 생성 간격을 최대 42% 단축하고, 이후에는 기존 후반 밀도로 자연스럽게 연결한다.
      spawnInterval=phaseIntervals[Math.min(6,phaseIdx)]*(1-readiness*0.42*earlyWeight);
      spawnTimer += dt;
      if(spawnTimer>=spawnInterval && enemies.length<MAX_ENEMIES){
        spawnTimer=0;
        let batch=phaseIdx>=5?3:phaseIdx>=3?2:1;
        if(phaseIdx>=2 && Math.random()<(phaseIdx>=5?.42:.28)) batch++;
        if(phaseIdx<=1 && Math.random()<readiness*(phaseIdx===0?.62:.48)) batch++;
        batch=Math.min(batch,MAX_ENEMIES-enemies.length);
        for(let i=0;i<batch;i++) spawnEnemy(false);
      }
      assaultWaveTimer-=dt;
      if(ROUND_DURATION>=25 && elapsed>=4 && assaultWaveTimer<=0){
        spawnAssaultWave(phaseIdx);
        const baseWaveDelay=phaseIdx>=6?4.8:phaseIdx>=5?5.4:phaseIdx>=3?6.5:7.5;
        assaultWaveTimer=Math.max(4.6,baseWaveDelay-readiness*1.8);
      }
      if(phaseIdx>=4){
        burstTimer -= dt;
        if(burstTimer<=0 && enemies.length<MAX_ENEMIES-8){
          burstTimer=phaseIdx>=6?2.4:phaseIdx===5?3.0:3.6;
          for(let i=0;i<(phaseIdx>=6?8:phaseIdx===5?6:5);i++) spawnEnemy(false);
        }
      }
      // 지휘관은 종료 15초 전에 등장하며, 생존 중 시간이 끝나면 8초 오버타임으로 이어진다.
      if(!commanderSpawned && elapsed>=getCommanderSpawnTime() && ROUND_DURATION>=40){
        commanderSpawned=true;
        warnBanner.textContent='⚠ 지휘관 최종 공세'; warnBanner.classList.remove('show'); void warnBanner.offsetWidth; warnBanner.classList.add('show');
        spawnBanner(base.x, base.y-76, '최종 목표: 지휘관 처치', '#e8a33d');
        commanderEntranceTimer=2.2;
        addScreenShake(14);
        addScreenFlash('#ff5a4f',0.42);
        for(let r=0;r<3;r++) pushFx({x:base.x,y:base.y,r:70+r*34,max:260+r*42,color:'#e0483f',life:.8+r*.2,t:-r*.08,type:'ring'});
        spawnEnemy(false, 'commander');
      }
    }
    wave = 1+Math.floor(elapsed/8);

    const autoInt = getAutoSpawnInterval();
    if(autoInt){ autoTimer+=dt; if(autoTimer>=autoInt){ autoTimer=0; for(let i=0;i<getAutoSpawnBatch();i++) spawnSoldier('auto'); } }

    // 수동 소환 쿨다운은 마우스를 떼어도 계속 흐른다.
    // 재클릭은 쿨다운을 초기화하지 않으므로 연타 소환이 불가능하다.
    manualSpawnCooldown = Math.max(0, manualSpawnCooldown-dt);
    if(holding && manualLockTimer<=0 && manualSpawnCooldown<=0){
      spawnSoldier('manual');
      manualSpawnCooldown = getManualSpawnInterval();
    }

    updateBaseLaser(dt);
    updateCollectorRobots(dt);

    omegaVolleyTimer-=dt;
    if(!roundEnding && isOmegaVolleyUnlocked() && getVisualTier()>=4 && omegaVolleyTimer<=0 && enemies.length){
      omegaVolleyTimer=getVisualTier()>=5?5.2:6.5;
      const firing=soldiers.slice().sort((a,b)=>Math.hypot(a.x-base.x,a.y-base.y)-Math.hypot(b.x-base.x,b.y-base.y)).slice(0,Math.min(24,soldiers.length));
      const priority=enemies.filter(en=>en.hp>0).sort((a,b)=>{
        const ap=(a.kind==='commander'?900:a.kind==='bomber'?500:a.kind==='siege'?430:a.elite?260:0)-Math.hypot(a.x-base.x,a.y-base.y)*.12;
        const bp=(b.kind==='commander'?900:b.kind==='bomber'?500:b.kind==='siege'?430:b.elite?260:0)-Math.hypot(b.x-base.x,b.y-base.y)*.12;
        return bp-ap;
      });
      spawnBanner(base.x,base.y-94,'전군 일제사격!','#dff7ff');
      firing.forEach((s,i)=>{
        const target=priority[i%Math.max(1,Math.min(priority.length,12))];
        if(!target) return;
        const dmg=s.dmg*.62;
        target.hp-=dmg;
        const delay=-(i%6)*.018;
        pushFx({x:s.x,y:s.y,x2:target.x,y2:target.y,color:i%3===0?'#ffffff':'#72c9ff',life:.22,t:delay,type:'tracer',width:2.4+(i%3===0?1.1:0)});
      });
      pushFx({x:base.x,y:base.y,r:base.radius,max:185,color:'#75d8ff',life:.60,t:0,type:'ring'});
      spawnRadialBurst(base.x,base.y,'#b8efff',30,155,2.0);
      addScreenFlash('#a8e9ff',.18);addScreenShake(8);
    }

    const targetCount = new Map();
    // 한 적에게 붙을 수 있는 병력 수를 제한한다. 초과 병력은 자기 방어 슬롯으로 복귀한다.
    for(const s of soldiers){
      if(!s.target || s.target.hp<=0 || enemies.indexOf(s.target)===-1){ s.target=null; continue; }
      const assigned=targetCount.get(s.target)||0;
      if(assigned>=getEnemyEngagementCap(s.target)) s.target=null;
      else targetCount.set(s.target,assigned+1);
    }
    const focusBonus = getFocusFireBonusPct();
    function pickTarget(s){
      let best=null, bestScore=Infinity;
      const formation=getFormationPoint(s);
      const homeAngle=Math.atan2(formation.y-base.y,formation.x-base.x);
      for(const en of enemies){
        const assigned=targetCount.get(en)||0;
        if(assigned>=getEnemyEngagementCap(en)) continue;
        const d=Math.hypot(en.x-s.x, en.y-s.y);
        const enemyAngle=Math.atan2(en.y-base.y,en.x-base.x);
        let priority=en.kind==='commander'?-390:en.kind==='bomber'?-250:en.kind==='siege'?-180:en.elite?-90:0;
        if(s.type==='cannon'){
          priority+=en.kind==='siege'?-360:en.kind==='armored'?-250:en.kind==='commander'?-210:en.kind==='bomber'?-80:80;
        } else if(s.type==='shield'){
          priority+=en.kind==='bomber'?-420:en.kind==='fast'?-130:en.kind==='siege'?170:0;
        }
        const assignmentPenalty=assigned*(s.type==='cannon'?34:52);
        const sectorPenalty=angleDistance(homeAngle,enemyAngle)*(s.type==='cannon'?22:38);
        const score=d+assignmentPenalty+sectorPenalty+priority;
        if(score<bestScore){bestScore=score;best=en;}
      }
      return best;
    }
    const assaultBuff = getAssaultCommand();
    for(const s of soldiers){
      s.recoil=Math.max(0,(s.recoil||0)-dt*5.5);
      if(!s.target){
        s.target=pickTarget(s);
        if(s.target) targetCount.set(s.target,(targetCount.get(s.target)||0)+1);
      }
      let spdMult=1, atkSpdMult=1;
      const assaultActive = assaultBuff && (elapsed-s.spawnTime)<8;
      if(assaultActive){ spdMult*=(1+assaultBuff.speed/100); atkSpdMult*=(1+assaultBuff.atk/100); }
      if(commandAtkSpeedTimer>0) atkSpdMult*=1.45;
      const effSpeed = s.speed*spdMult;
      s.atkCd = Math.max(0, s.atkCd-dt);
      if(s.target){
        const orbit=s.type==='cannon'?28:s.type==='rifler'?18:10;
        const ox=Math.cos(s.approachAngle)*orbit, oy=Math.sin(s.approachAngle)*orbit;
        const dx=(s.target.x+ox)-s.x, dy=(s.target.y+oy)-s.y;
        const d=Math.hypot(dx,dy)||1;
        const reach=s.range;
        s.facing=Math.atan2(s.target.y-s.y,s.target.x-s.x)+Math.PI/2;
        if(d>reach){ s.x+=(dx/d)*effSpeed*dt; s.y+=(dy/d)*effSpeed*dt; }
        else if(s.atkCd<=0){
          let dmg=s.dmg;
          if(focusBonus>0 && (targetCount.get(s.target)||0)>=2) dmg*=(1+focusBonus/100);
          if(s.target.kind==='commander') dmg*=s.type==='cannon'?.72:.55;
          if(s.type==='cannon'){
            if(s.target.kind==='armored') dmg*=1.55;
            if(s.target.kind==='siege') dmg*=1.75;
          }
          if(s.target.invulnTimer>0) dmg=0;
          s.target.hp -= dmg;
          s.atkCd = s.atkInterval/atkSpdMult;
          s.recoil=1;
          if(s.type==='cannon'){
            const splashTargets=enemies
              .filter(en=>en!==s.target && en.hp>0 && Math.hypot(en.x-s.target.x,en.y-s.target.y)<=s.splashRadius)
              .sort((a,b)=>Math.hypot(a.x-s.target.x,a.y-s.target.y)-Math.hypot(b.x-s.target.x,b.y-s.target.y))
              .slice(0,5);
            for(const en of splashTargets){
              let splash=dmg*s.splashRatio;
              if(en.kind==='commander') splash*=.45;
              if(en.invulnTimer>0) splash=0;
              en.hp-=splash;
            }
            spawnCombatTracer(s.x,s.y,s.target.x,s.target.y,'#9fe7ff',true);
            pushFx({x:s.target.x,y:s.target.y,r:4,max:s.splashRadius,color:'#7fcfff',life:.34,t:0,type:'ring'});
            spawnRadialBurst(s.target.x,s.target.y,'#b7e9ff',10,115,2.1);
            if(getVisualTier()>=3) addScreenShake(2.6);
          } else if(s.type==='shield'){
            spawnCombatTracer(s.x,s.y,s.target.x,s.target.y,'#79f0ff',true);
            pushFx({x:s.target.x,y:s.target.y,r:3,max:20,color:'#6fe8ff',life:.22,t:0,type:'ring'});
          } else {
            const shotColor=assaultActive?'#ffd76b':commandAtkSpeedTimer>0?'#8de7ff':'#66baff';
            spawnCombatTracer(s.x,s.y,s.target.x,s.target.y,shotColor,focusBonus>0 && (targetCount.get(s.target)||0)>=2);
            spawnHit(s.target.x, s.target.y, shotColor);
          }
        }
      } else {
        const formation=getFormationPoint(s);
        const dx=formation.x-s.x,dy=formation.y-s.y;
        const d=Math.hypot(dx,dy)||1;
        if(d>6){
          s.facing=Math.atan2(dy,dx)+Math.PI/2;
          const returnSpeed=d>80?0.82:0.58;
          s.x+=dx/d*effSpeed*returnSpeed*dt;
          s.y+=dy/d*effSpeed*returnSpeed*dt;
        }
      }
      s._assaultActive = assaultActive;
    }

    for(const en of enemies){
      const baseDx=base.x-en.x,baseDy=base.y-en.y,baseDist=Math.hypot(baseDx,baseDy)||1;

      // 폭파병은 기본적으로 기지를 노리지만, 가까운 실드 벌크가 진로를 끊으면 그 자리에서 먼저 폭발한다.
      if(en.kind==='bomber'){
        let blocker=null,blockDist=Infinity;
        for(const s of soldiers){
          if(s.type!=='shield' || s.hp<=0) continue;
          const d=Math.hypot(s.x-en.x,s.y-en.y);
          if(d<s.blockRadius+18 && d<blockDist){blocker=s;blockDist=d;}
        }
        if(blocker){
          if(blockDist>blocker.bodyRadius+9){
            en.x+=(blocker.x-en.x)/blockDist*en.speed*dt;
            en.y+=(blocker.y-en.y)/blockDist*en.speed*dt;
          } else {
            for(const s of soldiers){
              const d=Math.hypot(s.x-en.x,s.y-en.y);
              if(d<=52) damageSoldier(s,en.dmg*(s===blocker?.58:.32));
            }
            if(baseDist<base.radius+72) damageBase(en.dmg*.42);
            en.detonated=true;en.hp=0;
            for(let r=0;r<3;r++) pushFx({x:en.x,y:en.y,r:7+r*10,max:62+r*22,color:r%2?'#ffd24e':'#56dfff',life:.42+r*.09,t:-r*.03,type:'ring'});
            spawnRadialBurst(en.x,en.y,'#a9f4ff',26,165,2.7);
            spawnBanner(blocker.x,blocker.y-38,'실드 벌크 차단!','#8ff4ff');
            addScreenShake(8);addScreenFlash('#8befff',.18);
          }
        } else if(baseDist>base.radius+10){
          en.x+=baseDx/baseDist*en.speed*dt;en.y+=baseDy/baseDist*en.speed*dt;
          if(Math.random()<dt*8) pushFx({x:en.x,y:en.y,vx:(Math.random()-.5)*18,vy:(Math.random()-.5)*18,drag:3,size:1.6,color:'#ffd34f',life:.22,t:0,type:'shard',rot:Math.random()*6});
        } else {
          damageBase(en.dmg*1.22);en.detonated=true;en.hp=0;
          for(let r=0;r<4;r++) pushFx({x:base.x,y:base.y,r:8+r*11,max:80+r*28,color:r%2?'#ffd24e':'#ff5d36',life:.48+r*.10,t:-r*.03,type:'ring'});
          spawnRadialBurst(base.x,base.y,'#ffbf42',34,190,3.0);
          addScreenShake(13);addScreenFlash('#ffb13e',.38);damageVignetteAlpha=Math.max(damageVignetteAlpha,.48);
          spawnBanner(base.x,base.y-68,'폭파병 기지 타격!','#ffcf66');
          if(base.hp<=0){endRound(false);return;}
        }
        continue;
      }

      // 지휘관은 체력 구간마다 장갑이 파괴되고 코인·증원·폭발이 실제 전투와 함께 발생한다.
      if(en.kind==='commander'){
        en.armorFlash=Math.max(0,(en.armorFlash||0)-dt*2.5);
        en.invulnTimer=Math.max(0,(en.invulnTimer||0)-dt);
        const hpRatio=en.hp/en.maxHp;
        if(hpRatio<=.67 && !en.bossBreak1){en.bossBreak1=true;triggerBossPhaseBreak(en,1);}
        if(hpRatio<=.34 && !en.bossBreak2){en.bossBreak2=true;triggerBossPhaseBreak(en,2);}
        en.specialCd-=dt;
        if(en.specialCd<=0){
          en.specialCd=hpRatio<=.34?2.05:hpRatio<=.67?2.55:3.05;
          const victims=soldiers.slice().sort((a,b)=>Math.hypot(a.x-en.x,a.y-en.y)-Math.hypot(b.x-en.x,b.y-en.y)).slice(0,Math.min(8,soldiers.length));
          for(const s of victims){damageSoldier(s,en.soldierDmg*.48);spawnCombatTracer(en.x,en.y,s.x,s.y,'#ff7164',true);}
          damageBase(en.dmg*.34);
          pushFx({x:en.x,y:en.y,r:18,max:185,color:'#ff4e45',life:.72,t:0,type:'ring'});
          pushFx({x:base.x,y:base.y,r:base.radius,max:base.radius+78,color:'#ff6a55',life:.45,t:0,type:'ring'});
          spawnRadialBurst(en.x,en.y,'#ff6658',24,145,2.5);
          spawnBanner(en.x,en.y-42,'지휘관 포격!','#ff9c91');
          addScreenShake(9);addScreenFlash('#ff5148',.20);damageVignetteAlpha=Math.max(damageVignetteAlpha,.26);
          if(base.hp<=0){endRound(false);return;}
        }
      }

      // 공성체는 병력벽 뒤에서 실제 기지를 계속 압박한다.
      if(en.kind==='siege'){
        if(baseDist>en.baseAttackRange){
          en.x+=baseDx/baseDist*en.speed*dt;en.y+=baseDy/baseDist*en.speed*dt;
        } else {
          en.atkCd=Math.max(0,en.atkCd-dt);
          if(en.atkCd<=0){
            damageBase(en.dmg);en.atkCd=en.baseAtkInterval;
            spawnCombatTracer(en.x,en.y,base.x,base.y,'#ff9a52',true);
            pushFx({x:base.x,y:base.y,r:base.radius,max:base.radius+62,color:'#ff7b3f',life:.42,t:0,type:'ring'});
            addScreenShake(6);addScreenFlash('#ff5f35',.16);damageVignetteAlpha=Math.max(damageVignetteAlpha,.30);
            if(base.hp<=0){endRound(false);return;}
          }
        }
        continue;
      }

      let engaged=null, ed=Infinity;
      const fastRush=en.kind==='fast' && baseDist>base.radius+58 && en.hp/en.maxHp>.42;
      if(!fastRush){
        for(const s of soldiers){
          const d=Math.hypot(s.x-en.x, s.y-en.y);
          const reach=s.blockRadius||30;
          const priorityDist=d-(s.type==='shield'?16:0);
          if(d<reach && priorityDist<ed){ ed=priorityDist; engaged=s; }
        }
      }
      if(engaged){
        en.atkCd=Math.max(0, en.atkCd-dt);
        if(en.atkCd<=0){
          if(en.soldierHitCount>1){
            const nearby=soldiers
              .map(s=>({s,d:Math.hypot(s.x-en.x,s.y-en.y)}))
              .filter(v=>v.d<=62)
              .sort((a,b)=>a.d-b.d)
              .slice(0,en.soldierHitCount);
            for(const v of nearby){
              damageSoldier(v.s,en.soldierDmg);
              spawnCombatTracer(en.x,en.y,v.s.x,v.s.y,'#ff655c',true);
              spawnHit(v.s.x,v.s.y,'#e0483f');
            }
            spawnPulse(en.x,en.y,'#e0483f');
            addScreenShake(en.kind==='commander'?5:1.8);
          } else {
            damageSoldier(engaged,en.soldierDmg);
            spawnCombatTracer(en.x,en.y,engaged.x,engaged.y,'#ff655c',en.elite);
            spawnHit(engaged.x,engaged.y,'#e0483f');
          }
          en.atkCd=en.soldierAtkInterval;
        }
        continue;
      }
      const dx=baseDx, dy=baseDy, d=baseDist;
      if(d>base.radius+8){ en.x+=(dx/d)*en.speed*dt; en.y+=(dy/d)*en.speed*dt; }
      else {
        en.atkCd=Math.max(0, en.atkCd-dt);
        if(en.atkCd<=0){
          damageBase(en.dmg); en.atkCd=en.baseAtkInterval; spawnPulse(base.x, base.y, '#e0483f');
          spawnCombatTracer(en.x,en.y,base.x,base.y,'#ff443d',true);
          addScreenShake(en.kind==='commander'?9:4);
          addScreenFlash('#ff2f28',en.kind==='commander'?.30:.12);
          damageVignetteAlpha=Math.max(damageVignetteAlpha,en.kind==='commander'?.52:.24);
          if(base.hp<=0){ endRound(false); return; }
        }
      }
    }

    separate(soldiers); separate(enemies,18);

    const mag = getMagnetic();
    const cursorMagnetLevel = L('pickupRadius');
    const cursorAvailable=cursorIsAvailable(mouseX,mouseY);
    pruneCursorTrail(performance.now()/1000);

    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i]; c.t+=dt; const popped=c.t>=c.popDur;
      let autoCollected=false;
      let cursorCollected=false;
      const droneCollected=!!c.droneCollected;

      const cursorDx=mouseX-c.tx, cursorDy=mouseY-c.ty;
      const cursorDist=cursorAvailable?(Math.hypot(cursorDx,cursorDy)||1):Infinity;
      const recentPathDistance=cursorAvailable?distanceToRecentCursorPath(c.tx,c.ty):Infinity;

      // 모든 레벨 공통 직접 수집 판정:
      // 커서의 현재 점이 아니라 최근 0.12초 동안 지나간 '두께 있는 통로'를 검사한다.
      // 따라서 코인을 빠르게 쓸어 지나가도 실제로 가까이 스쳤다면 즉시 획득된다.
      if(popped && cursorAvailable && recentPathDistance<=DIRECT_PICKUP_SWEEP_RADIUS){
        cursorCollected=true;
        c.cursorMagnetized=false;
        c.cursorCaptureTimer=0;
        c.cursorGlow=0;
      }

      // Lv.1 이상 커서 자석:
      // 최근 이동 경로가 자석 범위를 통과하면 코인을 포착한다.
      // 한 번 포착된 코인은 시간이나 거리 때문에 놓지 않고, 획득되거나 커서가 화면 밖으로 나갈 때까지 추적한다.
      if(!cursorCollected && popped && cursorAvailable && cursorMagnetLevel>0){
        if(recentPathDistance<=PICKUP_RADIUS) c.cursorMagnetized=true;

        if(c.cursorMagnetized){
          c.cursorGlow=Math.min(1,(c.cursorGlow||0)+dt*5);
          c.magnetized=false;
          c.magnetGlow=Math.max(0,(c.magnetGlow||0)-dt*5);

          const normalized=Math.min(1,cursorDist/PICKUP_RADIUS);
          const proximity=1-normalized;
          // 멀어졌을 때는 추격력을 높이고, 가까워지면 부드럽게 감속한다.
          const catchupBoost=cursorDist>PICKUP_RADIUS
            ? Math.min(14,5+(cursorDist/PICKUP_RADIUS)*2.4)
            : 0;
          const pullRate=3.4+8.8*Math.pow(proximity,1.5)+catchupBoost;
          const follow=1-Math.exp(-pullRate*dt);
          c.tx+=cursorDx*follow;
          c.ty+=cursorDy*follow;

          // 현재 커서뿐 아니라 최근 이동 경로에 코인이 닿아도 획득 처리한다.
          const afterMovePathDistance=distanceToRecentCursorPath(c.tx,c.ty);
          if(cursorDist<=9 || afterMovePathDistance<=10) cursorCollected=true;
        } else {
          c.cursorGlow=Math.max(0,(c.cursorGlow||0)-dt*6);
        }
      } else if(cursorMagnetLevel===0 || !cursorAvailable || !popped){
        c.cursorMagnetized=false;
        c.cursorCaptureTimer=0;
        c.cursorGlow=cursorMagnetLevel===0?0:Math.max(0,(c.cursorGlow||0)-dt*6);
      }

      // 기지 수집 반경: 커서가 잡지 않은 코인만 기지로 회수한다.
      // 바깥에서는 천천히 출발하고, 기지에 가까워질수록 점진적으로 빨라진다.
      if(!cursorCollected && !c.cursorMagnetized && popped && mag){
        const dxb=base.x-c.tx, dyb=base.y-c.ty;
        const distBase=Math.hypot(dxb,dyb)||1;
        const releaseRange=mag.range*1.06;
        const baseActive=distBase<=mag.range || (c.magnetized && distBase<=releaseRange);
        if(baseActive){
          c.magnetized=true;
          c.magnetGlow=Math.min(1,(c.magnetGlow||0)+dt*3.5);
          const proximity=1-Math.min(1,distBase/mag.range);
          const speed=mag.speed*(0.48+1.35*Math.pow(proximity,1.7))*(0.35+0.65*c.magnetGlow);
          const move=Math.min(distBase,speed*dt);
          c.tx+=dxb/distBase*move;
          c.ty+=dyb/distBase*move;
          if(Math.hypot(c.tx-base.x,c.ty-base.y)<=base.radius+7) autoCollected=true;
        } else {
          c.magnetized=false;
          c.magnetGlow=Math.max(0,(c.magnetGlow||0)-dt*4);
        }
      } else if(!mag || c.cursorMagnetized || cursorCollected){
        c.magnetized=false;
        c.magnetGlow=Math.max(0,(c.magnetGlow||0)-dt*5);
      }

      if(popped && (cursorCollected || autoCollected || droneCollected)){
        const gained=c.value*getGoldMultiplier(c.eliteMult);
        gold+=gained; earnedThisRound+=gained;
        const shown=Math.max(1,Math.floor(gained));
        const drone=c.droneCollector;
        const popX=droneCollected&&drone?drone.x:(autoCollected?base.x:(cursorAvailable?mouseX:c.tx));
        const popY=droneCollected&&drone?drone.y-10:(autoCollected?base.y-12:(cursorAvailable?mouseY-10:c.ty));
        spawnGoldPop(popX, popY, shown,(COIN_TYPES[c.coinType]||COIN_TYPES.yellow).pop);
        applyGoldGainAccumulator(c,gained,popX,popY);
        if(autoCollected) spawnPulse(base.x,base.y,(COIN_TYPES[c.coinType]||COIN_TYPES.yellow).pop);
        if(droneCollected&&drone){
          spawnCombatTracer(drone.x,drone.y,base.x,base.y,'#7ff2c8',false);
          pushFx({x:drone.x,y:drone.y,r:2,max:18,color:'#7ff2c8',life:.28,t:0,type:'ring'});
        }
        releaseDroneTarget(c);
        coins.splice(i,1);
      }
    }

    for(let i=enemies.length-1;i>=0;i--){
      if(enemies[i].hp<=0){
        const defeated=enemies[i];
        if(defeated.detonated){enemies.splice(i,1);continue;}
        kills++;
        comboCount = comboTimer>0 ? comboCount+1 : 1; comboTimer=3;
        spawnDeathFx(defeated);
        if(getVisualTier()>=2 && kills%10===0){
          spawnBanner(base.x,base.y-94,kills+' KILL STREAK','#ffd06e');
          addScreenFlash('#ffd06e',0.12);
          addScreenShake(4);
        }
        if(L('chainBounty')>0 && comboCount>=10 && comboCount%10===0){
          const burstCoins=4+L('chainBounty')*2+Math.min(8,Math.floor(comboCount/15));
          for(let b=0;b<burstCoins;b++) spawnCoin(defeated.x,defeated.y,1,1,{coinType:'yellow',minDist:22,maxDist:66,popDur:.45});
          spawnBanner(defeated.x,defeated.y-28,comboCount+' COMBO 현상금!','#ffd06e');
          pushFx({x:defeated.x,y:defeated.y,r:8,max:88,color:'#ffd06e',life:.55,t:0,type:'ring'});
          addScreenShake(5);
        }
        spawnEnemyCoinDrops(defeated);
        if(defeated.kind==='commander'){
          commanderDefeated=true;
          commanderBonus=COMMANDER_DEFEAT_BONUS;
          gold+=commanderBonus;
          earnedThisRound+=commanderBonus;
          spawnGoldPop(defeated.x,defeated.y,commanderBonus,'#e8a33d');
          spawnBanner(base.x,base.y-72,'지휘관 격파 보너스 +'+commanderBonus,'#e8a33d');
          if(overtimeActive){overtimeActive=false;roundEnding=true;roundEndGrace=1.45;timeLeft=0;}
        }
        enemies.splice(i,1);
      }
    }
    for(let i=soldiers.length-1;i>=0;i--){
      if(soldiers[i].hp<=0){
        const fallen=soldiers[i];
        const color=fallen.type==='shield'?'#6fe8ff':fallen.type==='cannon'?'#9fc7ff':'#7d8ba0';
        spawnHit(fallen.x,fallen.y,color);
        if(fallen.type!=='rifler') spawnRadialBurst(fallen.x,fallen.y,color,8,80,1.8);
        soldiers.splice(i,1);
      }
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.t+=dt;
      if(Number.isFinite(p.vx)) p.x+=p.vx*dt;
      if(Number.isFinite(p.vy)) p.y+=p.vy*dt;
      if(Number.isFinite(p.drag)){
        const damp=Math.exp(-p.drag*dt);
        if(Number.isFinite(p.vx)) p.vx*=damp;
        if(Number.isFinite(p.vy)) p.vy*=damp;
      }
      if(Number.isFinite(p.spin)) p.rot=(p.rot||0)+p.spin*dt;
      if(p.t>=p.life) particles.splice(i,1);
    }

    updateHud();
  }

  function endRound(success){
    if(!running) return;
    running=false;
    comboHud.classList.remove('show'); bossHud.classList.remove('show');
    screenFlashAlpha=0; damageVignetteAlpha=0; coinDrones.forEach(d=>d.target=null);
    dangerVignette.style.opacity='0'; screenFlashDom.style.opacity='0';
    cmdBtn.classList.remove('show'); cmdPanel.classList.remove('show'); commandState='done'; gameSpeedMult=1;
    const survived = Math.floor(elapsed);
    const collectedGold=Math.floor(gold);
    const settlementRate=success?1.00:0.65;
    const settledGold=Math.floor(collectedGold*settlementRate);
    meta.gold += settledGold;
    meta.records.rounds++;
    meta.records.bestWave = Math.max(meta.records.bestWave, wave);
    meta.records.bestKills = Math.max(meta.records.bestKills, kills);
    meta.records.bestTime = Math.max(meta.records.bestTime, survived);
    persistSave();

    overlayTitle.textContent = success ? '라운드 클리어' : '거점 함락';
    overlayTitle.style.color = success ? 'var(--hp)' : 'var(--enemy)';
    finalTime.textContent = survived; finalWave.textContent = wave; finalKills.textContent = kills;
    goldEarnedEl.textContent = settledGold;
    roundRewardNoteEl.textContent = success
      ? '수집 '+collectedGold+(commanderDefeated?' · 지휘관 격파 포함':'')
      : '수집 '+collectedGold+' · 함락 정산 65%';
    goldBankedEl.textContent = bankGoldText();
    overlay.classList.add('show');
  }

  // ---------- drawing ----------
  function draw(){
    const tier=getVisualTier();
    ctx.clearRect(0,0,W,H);

    // 깊이감 있는 전장 배경. 성장 전에는 차분하고, 극후반으로 갈수록 에너지 밀도가 높아진다.
    const bg=ctx.createRadialGradient(base.x,base.y,20,base.x,base.y,Math.max(W,H)*.72);
    bg.addColorStop(0,tier>=4?'#101c2a':'#0d151f');
    bg.addColorStop(.48,tier>=3?'#090f18':'#090d13');
    bg.addColorStop(1,'#05070b');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    for(const st of ambientStars){
      const tw=.25+.55*(.5+.5*Math.sin(elapsed*(.5+st.depth)+st.phase));
      ctx.globalAlpha=(.12+tier*.035)*tw;
      ctx.fillStyle=st.depth>.7?'#7dc7ff':'#8b9db1';
      ctx.beginPath();ctx.arc(st.x,st.y,st.r*(.65+tier*.06),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    screenShakeX=screenShake>0?(Math.random()-.5)*screenShake:0;
    screenShakeY=screenShake>0?(Math.random()-.5)*screenShake:0;
    ctx.save();
    ctx.translate(screenShakeX,screenShakeY);

    ctx.save(); ctx.strokeStyle='rgba(45,72,94,'+(0.22+tier*.035)+')'; ctx.lineWidth=1;
    const gap=tier>=4?32:40;
    const scroll=(elapsed*(tier>=3?8:2))%gap;
    for(let x=(cx%gap)+scroll-gap; x<W; x+=gap){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=(cy%gap)+scroll-gap; y<H; y+=gap){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.restore();

    if(tier>=3){
      ctx.save();ctx.translate(base.x,base.y);ctx.rotate(elapsed*.08);
      ctx.strokeStyle='rgba(76,151,215,'+(0.08+tier*.025)+')';ctx.lineWidth=1.2;
      for(let i=0;i<4;i++){
        ctx.beginPath();ctx.arc(0,0,250+i*42,i*.8,i*.8+1.15);ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save(); ctx.translate(base.x, base.y);
    const sweepAngle=(elapsed*0.8)%(Math.PI*2);
    const grad = ctx.createConicGradient ? ctx.createConicGradient(sweepAngle,0,0) : null;
    if(grad){ grad.addColorStop(0,'rgba(79,163,227,0.25)'); grad.addColorStop(0.12,'rgba(79,163,227,0)'); grad.addColorStop(1,'rgba(79,163,227,0)');
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,220,0,Math.PI*2); ctx.fill(); }
    ctx.restore();

    ctx.save(); ctx.strokeStyle='rgba(79,163,227,0.15)'; ctx.lineWidth=1;
    for(let r=70;r<=210;r+=70){ ctx.beginPath(); ctx.arc(base.x,base.y,r,0,Math.PI*2); ctx.stroke(); }
    ctx.restore();

    for(const p of particles){
      const k=Math.max(0,p.t/p.life);
      if(p.type==='ring'){
        ctx.save(); ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle=p.color; ctx.lineWidth=2.2+(1-k)*2.2;
        ctx.shadowColor=p.color; ctx.shadowBlur=tier>=3?10:0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r+(p.max-p.r)*Math.min(1,k),0,Math.PI*2); ctx.stroke(); ctx.restore();
      } else if(p.type==='portal'){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(elapsed*2.4+(p.phase||0));
        ctx.globalAlpha=Math.max(0,1-k);ctx.strokeStyle=p.color;ctx.lineWidth=1.5;
        const rr=p.r+(p.max-p.r)*Math.min(1,k);
        for(let q=0;q<3;q++){
          ctx.beginPath();ctx.arc(0,0,Math.max(.5,rr-q*4),q*1.7,q*1.7+Math.PI*.9);ctx.stroke();
        }
        ctx.restore();
      } else if(p.type==='tracer'){
        ctx.save();
        const fade=Math.max(0,1-k);
        const dx=p.x2-p.x,dy=p.y2-p.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
        const head=Math.min(1,k*4);
        const tail=Math.max(0,head-.55);
        const x1=p.x+dx*tail,y1=p.y+dy*tail,x2=p.x+dx*head,y2=p.y+dy*head;
        ctx.globalAlpha=fade;
        ctx.strokeStyle=p.color;ctx.lineCap='round';
        ctx.shadowColor=p.color;ctx.shadowBlur=8+tier*2;
        ctx.lineWidth=p.width+3;ctx.globalAlpha=fade*.16;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        ctx.globalAlpha=fade;ctx.lineWidth=p.width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        ctx.globalAlpha=fade*.9;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x2,y2,1.3+p.width*.35,0,Math.PI*2);ctx.fill();
        ctx.restore();
      } else if(p.type==='smoke'){
        ctx.save();ctx.globalAlpha=Math.max(0,(1-k)*.34);ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,(p.size||7)*(1+k*1.6),0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }

    for(const c of coins){
      const k=Math.min(1,c.t/c.popDur), ex=1-Math.pow(1-k,3);
      const x=c.x+(c.tx-c.x)*ex, arcY=-Math.sin(k*Math.PI)*18, y=c.y+(c.ty-c.y)*ex+arcY;
      const bob = k>=1?Math.sin(elapsed*4+c.bob)*2:0;
      const cursorMagnetLevel=L('pickupRadius');
      const hoverRadius=cursorMagnetLevel>0?PICKUP_RADIUS:24;
      const near = k>=1 && (c.cursorMagnetized || Math.hypot(mouseX-c.tx, mouseY-c.ty)<=hoverRadius);
      const type=c.coinType||'yellow';

      // 선으로 연결하거나 빙글 도는 연출은 제거하고, 끌리는 코인 자체에만 얇은 잔광을 준다.
      if(k>=1 && c.cursorMagnetized){
        const glow=Math.max(0,Math.min(1,c.cursorGlow||0));
        ctx.save();
        ctx.globalAlpha=0.08+glow*0.14;
        ctx.beginPath(); ctx.arc(x,y+bob,(type==='red'?15:11)+glow*2.5,0,Math.PI*2);
        ctx.fillStyle=(COIN_TYPES[type]||COIN_TYPES.yellow).pop;
        ctx.fill();
        ctx.restore();
      }

      if(k>=1 && c.magnetized){
        const glow=Math.max(0,Math.min(1,c.magnetGlow||0));
        ctx.save();
        ctx.globalAlpha=0.07+glow*0.12;
        ctx.beginPath(); ctx.arc(x,y+bob,(type==='red'?16:12)+glow*2.5,0,Math.PI*2);
        ctx.fillStyle=(COIN_TYPES[type]||COIN_TYPES.yellow).pop;
        ctx.fill();
        ctx.restore();
      }

      ctx.save(); ctx.translate(x,y+bob);
      if(near){
        ctx.beginPath(); ctx.arc(0,0,type==='red'?17:14,0,Math.PI*2);
        ctx.fillStyle=type==='blue'?'rgba(82,185,255,.25)':type==='purple'?'rgba(179,108,255,.25)':type==='red'?'rgba(255,83,83,.28)':'rgba(232,163,61,.25)';
        ctx.fill();
      }
      if(type==='yellow'){
        ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2);
        const g=ctx.createRadialGradient(-2,-2,1,0,0,7); g.addColorStop(0,'#fff0b8'); g.addColorStop(1,'#e8a33d');
        ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='#8a5a12'; ctx.stroke();
      } else if(type==='blue'){
        ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2);
        const g=ctx.createRadialGradient(-2,-2,1,0,0,8); g.addColorStop(0,'#d9f4ff'); g.addColorStop(1,'#329ee8');
        ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#9be3ff'; ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1; ctx.stroke();
      } else if(type==='purple'){
        const r=9; ctx.beginPath();
        for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3, px=Math.cos(a)*r, py=Math.sin(a)*r; if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py); }
        ctx.closePath();
        const g=ctx.createRadialGradient(-2,-2,1,0,0,9); g.addColorStop(0,'#f1d9ff'); g.addColorStop(1,'#8c3ed1');
        ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#d7a4ff'; ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(-1,-5,2,10); ctx.fillRect(-5,-1,10,2);
      } else {
        ctx.shadowColor='#ff4444'; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2);
        const g=ctx.createRadialGradient(-3,-3,1,0,0,11); g.addColorStop(0,'#ffd0b8'); g.addColorStop(.45,'#ff5a4f'); g.addColorStop(1,'#a50f18');
        ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#ffd45e'; ctx.stroke();
        ctx.shadowBlur=0; ctx.fillStyle='#fff3a0'; ctx.font='bold 9px Orbitron'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',0,1);
      }
      ctx.restore();
    }

    for(const d of coinDrones){
      ctx.save();
      if(d.target){
        ctx.globalAlpha=.28+.18*Math.sin(d.beamPulse);
        ctx.strokeStyle='#7ff2c8';ctx.lineWidth=1;ctx.setLineDash([4,6]);
        ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.target.tx,d.target.ty);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.translate(d.x,d.y);ctx.rotate(d.facing||0);
      ctx.globalAlpha=1;
      if(d.flash>0){ctx.shadowColor='#9effdf';ctx.shadowBlur=12+d.flash*14;}
      const drawn=drawUnitSprite('collector',31,38);
      if(!drawn){
        ctx.fillStyle=d.flash>0?'#eafff7':'#79e5c2';ctx.shadowColor='#79e5c2';ctx.shadowBlur=8+d.flash*10;
        ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#bfffee';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-8,-7);ctx.lineTo(0,-13);ctx.lineTo(8,-7);ctx.stroke();
      }
      ctx.restore();
    }

    for(const s of soldiers){
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.facing||0);
      const auraRadius=(s.bodyRadius||10)+4+tier*.7;
      if(tier>=2){
        ctx.globalAlpha=.12+tier*.02;
        ctx.fillStyle=s.type==='shield'?'#65ecff':s.type==='cannon'?'#99c7ff':s._assaultActive?'#ffd76b':'#4fa3e3';
        ctx.beginPath();ctx.arc(0,0,auraRadius,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      }
      if(s._assaultActive){
        ctx.strokeStyle='#ffd76b';ctx.shadowColor='#ffd76b';ctx.shadowBlur=8;ctx.lineWidth=1.7;
        ctx.beginPath();ctx.arc(0,0,auraRadius+2,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
      }
      if(commandAtkSpeedTimer>0 && tier>=2){
        ctx.strokeStyle='rgba(120,230,255,.8)';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(0,0,auraRadius+5+Math.sin(elapsed*9+s.guardAngle)*2,-1.2,1.2);ctx.stroke();
      }
      if(s.type==='shield'){
        ctx.globalAlpha=.16;ctx.fillStyle='#7af2ff';ctx.beginPath();ctx.arc(0,-5,21,-Math.PI*.88,-Math.PI*.12);ctx.lineTo(0,-5);ctx.fill();ctx.globalAlpha=1;
      }
      if(s.recoil>0 && s.type==='cannon') ctx.translate(0,s.recoil*3.5);
      const drawn=drawUnitSprite(s.sprite||'rifler',s.drawW||32,s.drawH||39);
      if(!drawn){
        ctx.fillStyle=s.type==='shield'?'#7de8f2':s.type==='cannon'?'#91bfe8':'#4fa3e3';
        ctx.beginPath();
        if(s.type==='shield'){ctx.arc(0,2,13,Math.PI,0);ctx.lineTo(8,10);ctx.lineTo(-8,10);ctx.closePath();}
        else if(s.type==='cannon'){ctx.arc(0,2,11,0,Math.PI*2);ctx.moveTo(-3,-8);ctx.rect(-3,-17,6,12);}
        else {ctx.moveTo(0,-13);ctx.lineTo(9,9);ctx.lineTo(0,5);ctx.lineTo(-9,9);ctx.closePath();}
        ctx.fill();
      }
      ctx.rotate(-(s.facing||0));
      const w=s.type==='shield'?28:s.type==='cannon'?25:21;
      if(s.hp<s.maxHp*.995){
        ctx.fillStyle='rgba(0,0,0,0.58)';ctx.fillRect(-w/2,(s.drawH||39)/2+2,w,3);
        ctx.fillStyle=s.type==='shield'?'#60dff0':'#3fbf7f';ctx.fillRect(-w/2,(s.drawH||39)/2+2,w*Math.max(0,s.hp/s.maxHp),3);
      }
      ctx.restore();
    }

    for(const en of enemies){
      ctx.save(); ctx.translate(en.x,en.y);
      let radius=8, col='#e0483f';
      if(en.kind==='fast'){ radius=7; col='#5fd0e0'; }
      if(en.kind==='armored'){ radius=10; col='#8a5a3f'; }
      if(en.kind==='siege'){ radius=11; col='#b75d32'; }
      if(en.kind==='bomber'){ radius=8; col='#e6a829'; }
      if(en.kind==='commander'){ radius=15; col='#7a1f1f'; }
      if(en.elite){ radius+=3; }
      if(en.spawnFx>0){ en.spawnFx=Math.max(0,en.spawnFx-.016); ctx.globalAlpha=.45+.55*(1-en.spawnFx/.42); }
      if(tier>=2 || en.elite){
        ctx.globalAlpha*=.16+(en.elite?.16:.05);
        ctx.fillStyle=en.elite?'#e8a33d':col;ctx.beginPath();ctx.arc(0,0,radius+6+tier,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=en.spawnFx>0?.45+.55*(1-en.spawnFx/.42):1;
      }
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=en.elite||tier>=4?8+tier:0;
      ctx.beginPath();
      if(en.kind==='siege'){
        ctx.rotate(Math.PI/4);ctx.rect(-radius*.78,-radius*.78,radius*1.56,radius*1.56);
      } else if(en.kind==='bomber'){
        for(let q=0;q<8;q++){const a=-Math.PI/2+q*Math.PI/4,rr=q%2?radius*.55:radius;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(q===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();
      } else ctx.arc(0,0,radius,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle = en.elite ? '#e8a33d' : '#3a0f0d'; ctx.lineWidth = en.elite?2.5:1.5; ctx.stroke();
      if(en.kind==='siege'){
        ctx.rotate(-Math.PI/4);ctx.strokeStyle='#ffb16e';ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(8,0);ctx.moveTo(5,-3);ctx.lineTo(9,0);ctx.lineTo(5,3);ctx.stroke();
      }
      if(en.elite){ ctx.fillStyle='#e8a33d'; ctx.font="700 9px 'Orbitron', sans-serif"; ctx.textAlign='center'; ctx.fillText('★', 0, -radius-6); }
      if(en.kind==='siege'){
        ctx.fillStyle='#ffbf86';ctx.font="700 8px 'Orbitron', sans-serif";ctx.textAlign='center';ctx.fillText('공성',0,-radius-12);
      }
      if(en.kind==='bomber'){
        ctx.save();ctx.rotate(-elapsed*7);ctx.strokeStyle='#fff0a0';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,radius+5,-.8,.8);ctx.stroke();ctx.restore();
        ctx.fillStyle='#fff0a0';ctx.font="700 8px 'Orbitron', sans-serif";ctx.textAlign='center';ctx.fillText('폭파',0,-radius-11);
      }
      if(en.kind==='commander'){
        if(en.armorFlash>0){ctx.globalAlpha=.35*en.armorFlash;ctx.fillStyle='#fff6c9';ctx.beginPath();ctx.arc(0,0,radius+18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
        ctx.save();
        for(let q=0;q<3;q++){
          ctx.rotate((q%2?1:-1)*elapsed*(.35+q*.15));
          ctx.strokeStyle=q===1?'rgba(255,190,100,.65)':'rgba(224,72,63,.55)';
          ctx.lineWidth=q===1?2.4:1.4;
          ctx.beginPath();ctx.arc(0,0,radius+9+q*6+Math.sin(elapsed*4+q)*2,q*1.4,q*1.4+Math.PI*1.05);ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle='#ffb5aa'; ctx.font="700 9px 'Orbitron', sans-serif"; ctx.textAlign='center';
        ctx.fillText('지휘관',0,-radius-25);
      }
      const w=radius*2.2;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-w/2,radius+4,w,3);
      ctx.fillStyle='#e0483f'; ctx.fillRect(-w/2,radius+4,w*Math.max(0,en.hp/en.maxHp),3);
      ctx.restore();
    }

    ctx.save(); ctx.translate(base.x, base.y);
    const pulse=1+Math.sin(elapsed*3)*0.025;
    const coreColor=overloadTimer>0?'#ff9a3c':commandAtkSpeedTimer>0?'#70e6ff':'#4fa3e3';
    const laserCfg=getBaseLaser();
    if(laserCfg){
      const charge=Math.max(0,Math.min(1,baseLaserTimer/laserCfg.interval));
      ctx.save();ctx.rotate(-Math.PI/2);
      ctx.strokeStyle=baseLaserChargeFlash>0?'#eaffff':'rgba(110,235,255,.82)';
      ctx.shadowColor='#7ff2ff';ctx.shadowBlur=7+baseLaserChargeFlash*16;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(0,0,base.radius+18,0,Math.PI*2*charge);ctx.stroke();ctx.restore();
    }

    if(tier>=1){
      for(let q=0;q<Math.min(5,tier+1);q++){
        ctx.save();ctx.rotate((q%2?1:-1)*elapsed*(.22+q*.07)+q);
        ctx.strokeStyle=q===tier?'rgba(255,207,112,.65)':'rgba(79,163,227,'+(.18+tier*.025)+')';
        ctx.lineWidth=q===tier?2:1;
        ctx.beginPath();ctx.arc(0,0,base.radius+14+q*7,-.72,.72);ctx.stroke();ctx.restore();
      }
    }
    if(tier>=4){
      for(let q=0;q<4;q++){
        const a=elapsed*(.65+(q%2)*.18)+q*Math.PI/2;
        const rr=base.radius+29+tier*2;
        ctx.fillStyle=q%2?'#ffd06e':'#80d7ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;
        ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,2.3,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;
    }

    ctx.globalAlpha=.18+tier*.025;ctx.fillStyle=coreColor;ctx.beginPath();ctx.arc(0,0,base.radius+8+tier*2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(0,0,base.radius*pulse,0,Math.PI*2);
    const bgrad=ctx.createRadialGradient(-7,-8,3,0,0,base.radius*pulse);
    bgrad.addColorStop(0,tier>=3?'#d3f2ff':'#637a91');
    bgrad.addColorStop(.18,coreColor);
    bgrad.addColorStop(.48,'#26394c');
    bgrad.addColorStop(1,'#101721');
    ctx.fillStyle=bgrad;ctx.shadowColor=coreColor;ctx.shadowBlur=tier>=3?18:7;ctx.fill();ctx.shadowBlur=0;
    ctx.lineWidth=3; ctx.strokeStyle = base.hp/base.maxHp>0.3?'#e8a33d':'#e0483f'; ctx.stroke();

    if(tier>=2){
      ctx.rotate(elapsed*.32);
      ctx.strokeStyle='rgba(220,246,255,.72)';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(0,-13);ctx.lineTo(13,0);ctx.lineTo(0,13);ctx.closePath();ctx.stroke();
    }
    ctx.restore();

    // 기지 자동 레이저 레벨에 따라 실제 포드 이미지가 1~4기 배치되고 표적 방향으로 회전한다.
    const laserPods=getLaserPodPositions();
    for(let i=0;i<laserPods.length;i++){
      const pod=laserPods[i];
      const aim=baseLaserAimTargets.length?baseLaserAimTargets[i%baseLaserAimTargets.length]:null;
      const facing=aim?Math.atan2(aim.y-pod.y,aim.x-pod.x)+Math.PI/2:pod.angle+Math.PI/2;
      ctx.save();ctx.translate(pod.x,pod.y);ctx.rotate(facing);
      if(baseLaserChargeFlash>0){
        ctx.globalAlpha=.20+.25*baseLaserChargeFlash;ctx.fillStyle='#8ef5ff';ctx.shadowColor='#8ef5ff';ctx.shadowBlur=14;
        ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
      }
      if(!drawUnitSprite('laserPod',32,36)){
        ctx.fillStyle='#67d8ef';ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(12,10);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }

    ctx.save(); ctx.translate(base.x, base.y); ctx.rotate(-Math.PI/2);
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(0,0,base.radius+10,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = base.hp/base.maxHp>0.3?'#3fbf7f':'#e0483f';
    ctx.beginPath(); ctx.arc(0,0,base.radius+10,0,Math.PI*2*Math.max(0,base.hp/base.maxHp)); ctx.stroke();
    ctx.restore();

    for(const p of particles){
      const k=Math.max(0,p.t/p.life);
      if(p.type==='spark'){
        ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=tier>=2?7:0;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-k*.45),0,Math.PI*2);ctx.fill();ctx.restore();
      } else if(p.type==='shard'){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.globalAlpha=Math.max(0,1-k);
        ctx.strokeStyle=p.color;ctx.lineWidth=p.size||1.5;ctx.lineCap='round';ctx.shadowColor=p.color;ctx.shadowBlur=tier>=3?5:0;
        ctx.beginPath();ctx.moveTo(-(p.size||2)*2,0);ctx.lineTo((p.size||2)*2,0);ctx.stroke();ctx.restore();
      } else if(p.type==='text'){
        ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=p.bold?9:3;
        ctx.font=(p.bold?'900 ':'700 ')+(p.size||12)+"px 'Rajdhani', sans-serif";ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.restore();
      }
    }

    if(comboCount>1 && comboTimer>0){
      ctx.save(); ctx.fillStyle='#e8a33d'; ctx.font="700 14px 'Orbitron', sans-serif"; ctx.textAlign='center';
      ctx.fillText('콤보 x'+comboCount, base.x, base.y-base.radius-16); ctx.restore();
    }

    ctx.save(); ctx.fillStyle='#7d8ba0'; ctx.font="600 11px 'Rajdhani', sans-serif"; ctx.textAlign='center';
    ctx.fillText(Math.max(0,Math.ceil(base.hp))+' / '+base.maxHp+' HP', base.x, base.y+base.radius+26);
    ctx.restore();

    ctx.restore(); // screen shake world transform

    if(commanderEntranceTimer>0){
      const a=Math.min(1,commanderEntranceTimer/2.2);
      ctx.save();ctx.globalAlpha=.10*a;ctx.fillStyle='#ff342e';ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=.35*a;ctx.strokeStyle='#ff5b52';ctx.lineWidth=2;
      const rr=(2.2-commanderEntranceTimer)*Math.max(W,H)*.42;
      ctx.beginPath();ctx.arc(base.x,base.y,rr,0,Math.PI*2);ctx.stroke();ctx.restore();
    }

    if(tier>=5){
      const edge=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.2,cx,cy,Math.max(W,H)*.7);
      edge.addColorStop(0,'rgba(0,0,0,0)');
      edge.addColorStop(1,'rgba(30,4,8,'+(0.18+Math.sin(elapsed*2)*.025)+')');
      ctx.fillStyle=edge;ctx.fillRect(0,0,W,H);
    }
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    if(phase==='round'){ update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  renderLobby();
  requestAnimationFrame(fitTree);
  requestAnimationFrame(loop);
  loadSave();
})();
</script>
</body>
</html>
